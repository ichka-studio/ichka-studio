ngs for format, style control and variations.",["REGLES_parametres.md"]],["tools","Exemples & outils","Examples & tools","Des cas concrets et des listes d'inspiration pour démarrer plus vite.","Concrete cases and inspiration lists to start faster.",["EXEMPLE_boxe.md","EXEMPLE_pellicules.md","OUTIL_themes-liste.md"]]],"ficheData":{"CORE_antithese-visuelle.md":{"file":"CORE_antithese-visuelle.md","titleFr":"ADN ICHKA — tension visuelle signature","titleEn":"ICHKA DNA — signature visual tension","groupFr":"Fiches essentielles","groupEn":"Essential notes","descFr":"Le socle ICHKA : tension visuelle, lumière, cadrage et finitions de prompt.","descEn":"The ICHKA foundation: visual tension, light, framing and prompt finishing touches.","markdown":"---\ntitle: \"Antithèse visuelle – Explication\"\ncategorie: CORE\nsous-theme: Composition\ntype-doc: Fiche\nversion-mj: Général\n---\n\n## Qu'est-ce que l'antithèse visuelle ?\n\nL'antithèse visuelle, également appelée **contraste paradoxal**, désigne l'association de deux éléments opposés ou incongrus. Par exemple, un astronaute dans une jungle ou un lion dans les rues de New York. Ce procédé crée un effet de surprise, d'étrangeté ou de réflexion.\n\nEn art ou en storytelling, on peut également parler de dissonance visuelle, d'oxymore visuel, ou encore d'ironie conceptuelle.\n\n---\n\n## Les usages de l'antithèse visuelle\n\n**1. En art et design**\n- Surréalisme : Magritte, Dalí — juxtaposition d'éléments opposés\n- Pop art : mélange d'objets quotidiens avec des éléments fantastiques\n\n**2. En littérature**\n- L'antithèse : opposition de deux idées ou images\n- L'oxymore : contradiction dans les termes\n\n**3. En cinéma et photographie**\n- Contrastes visuels pour des scènes mémorables\n- Thèmes : aliénation, conflit, coexistence de deux mondes\n\n**4. En philosophie et psychologie**\n- Dichotomies universelles : nature vs technologie, ordre vs chaos\n\n---\n\n## Antithèse visuelle et création par IA\n\n**Pourquoi ça fonctionne bien :**\n- Inattendu et mémorable\n- Exploration visuelle illimitée\n- Richesse symbolique\n\n**Techniques pour exploiter l'antithèse :**\n1. **Structure** — Définir les pôles opposés, prioriser un élément dominant\n2. **Contrastes dans le prompt** — Adjectifs contradictoires, modificateurs visuels\n3. **Composition** — Opposition spatiale, hiérarchie visuelle\n4. **Textures et matières** — Oppositions tactiles ou symboliques\n5. **Nuances culturelles** — Fusion des styles artistiques\n6. **Expérimentation** — Plusieurs variations, raffinement progressif\n"},"CORE_eclairage.md":{"file":"CORE_eclairage.md","titleFr":"Lumière, visage, corps et environnement","titleEn":"Light, face, body and environment","groupFr":"Fiches essentielles","groupEn":"Essential notes","descFr":"Le socle ICHKA : tension visuelle, lumière, cadrage et finitions de prompt.","descEn":"The ICHKA foundation: visual tension, light, framing and prompt finishing touches.","markdown":"---\ntitle: \"Éclairage — Fiche CORE\"\ncategorie: CORE\nsous-theme: Éclairage\ntype-doc: Super Fiche\nversion-mj: Général\n---\n\n## Pourquoi l'éclairage est central\n\nMidjourney \"voit\" la lumière comme un **élément structurant**. L'éclairage détermine l'ambiance, la direction des ombres, les couleurs perçues, l'intensité émotionnelle. Il fonctionne autant sur un visage que sur un paysage ou une architecture.\n\n**Règle d'or** : un bon prompt d'éclairage décrit toujours **3 dimensions** — la **source**, la **couleur/qualité** et la **direction**. Si l'une manque, Midjourney improvise et le résultat dérive.\n\n---\n\n## 1. Décomposition technique en 3 couches\n\nToute scène lumineuse bien construite repose sur 3 couches qui se complètent.\n\n### Couche 1 — Backlight / Rim Light (éclairage arrière)\n**Position** : derrière le sujet, légèrement en diagonale.\n**Effet** : crée un halo lumineux autour des cheveux, des bras, des contours → détache le sujet du fond.\n**Prompts** : `backlight`, `rim lighting`, `glow outlining the silhouette`, `edge illumination`, `backlit silhouette`.\n\n### Couche 2 — Key Light (lumière principale)\n**Position** : de face ou légèrement décalée.\n**Effet** : éclaire le visage / sujet de façon douce mais lisible. Donne du modelé sans ombres dures.\n**Prompts** : `soft frontal lighting`, `even face illumination`, `cinematic beauty light`, `directional key light`.\n\n### Couche 3 — Fill Light / Warm Glow (éclairage d'ambiance secondaire)\n**Position** : source secondaire, souvent réfléchie ou liée à un effet (feu, magie, néon).\n**Utilité** : accentuer les zones, créer du contraste de température (chaud vs neutre/froid), ajouter du volume.\n**Prompts** : `warm light glow from the hands`, `firelight reflections`, `glow from below`, `orange light source`, `cold rim contrasting warm key`.\n\n---\n\n## 2. Sources de lumière courantes\n\n**Naturelles**\n`sunlight` · `moonlight` · `firelight` · `bioluminescent glow`\n\n**Artificielles**\n`candlelight` · `torchlight` · `lantern light` · `neon light` · `holographic glow`\n\n**Surnaturelles / fantastiques**\n`glowing crystal` · `magic light` · `ethereal radiance` · `divine light`\n\n---\n\n## 3. Qualité de la lumière\n\n| Qualité | Prompt EN | Effet |\n|---|---|---|\n| Douce | `soft light` / `diffused light` | Sans ombres dures, rendu subtil |\n| Dure | `harsh light` | Ombres nettes, contraste fort |\n| Tamisée | `dim light` | Pénombre, intimité |\n| Chaude | `warm light` | Tons jaunes/orangés, confort |\n| Froide | `cold light` | Tons bleus/blancs, austérité |\n| Vacillante | `flickering light` | Mouvement, instabilité |\n| Scintillante | `shimmering light` | Brillance variable |\n| Vibrante | `vibrant light` | Saturation forte |\n| Aveuglante | `blinding light` | Surexposition voulue |\n\n---\n\n## 4. Direction et effets spatiaux\n\n- `lit from below` — éclairé par-dessous (dramatique, inquiétant)\n- `lit from above` — éclairé par-dessus (divin, écrasant)\n- `lit from behind` — éclairé par l'arrière (silhouette)\n- `side lighting` — éclairage latéral (modelage fort)\n- `bathed in red light` — baigné d'une couleur dominante\n- `glowing from within` — illuminé de l'intérieur\n- `surrounded by glowing particles` — entouré de particules lumineuses\n- `casting long shadows` — projection d'ombres longues\n- `lit by a single candle` — source unique localisée\n\n---\n\n## 5. Erreurs fréquentes à corriger\n\n| ❌ Vague | ✅ Précis |\n|---|---|\n| \"une ambiance lumineuse\" | `a soft glowing light surrounding the scene` |\n| \"éclairage étrange\" | `illuminated by flickering blue light` |\n| \"belle lumière\" | `golden hour sunlight casting long warm shadows` |\n| \"il fait sombre\" | `dim moonlit interior with single candle as key light` |\n\n---\n\n## 6. Combos utiles (prêts à copier)\n\n- `soft natural daylight, warm directional key, subtle rim outlining silhouette`\n- `harsh artificial neon, cold cyan rim light, magenta fill from below`\n- `firelight key from below, dim ambient backlight, deep shadows engulfing the sides`\n- `golden hour sunlight, long warm shadows, soft bounce fill on the face`\n- `single candle illumination, deep falloff into darkness, chiaroscuro composition`\n\n---\n\n> **Astuce maîtresse** : décris toujours **source + couleur + direction**.\n> Laisse Midjourney \"voir\" la lumière comme un élément physique, pas comme un adjectif décoratif.\n"},"CORE_cadrage.md":{"file":"CORE_cadrage.md","titleFr":"Composition et cadrage","titleEn":"Composition and framing","groupFr":"Fiches essentielles","groupEn":"Essential notes","descFr":"Le socle ICHKA : tension visuelle, lumière, cadrage et finitions de prompt.","descEn":"The ICHKA foundation: visual tension, light, framing and prompt finishing touches.","markdown":"---\ntitle: \"Cadrage personnages & décors\"\ncategorie: COMP\nsous-theme: Cadrages\ntype-doc: Fiche\nversion-mj: v7\n---\n\n## Pourquoi le cadrage compte ?\nMidjourney **compose exactement ce que tu écris.** Le cadrage te permet de :\n- Choisir **où se trouve le spectateur**\n- Contrôler la **distance**, l'**angle** et la **profondeur**\n- Mettre l'accent sur le **sujet**, le **décor**, ou l'**ambiance**\n\n**Structure utile :** `[Vue ou angle]` + `[sujet]` + `[élément de contexte visuel]`\n\n---\n\n## Distance / Échelle de vue\n- `close-up` → gros plan\n- `extreme close-up` → très gros plan\n- `medium shot` → plan moyen\n- `full-body shot` → plan en pied\n- `wide shot` → plan large\n- `distant view` → vue lointaine\n- `over-the-shoulder view` → vue par-dessus l'épaule\n- `head and shoulders view` → plan buste\n\n## Angles de vue\n- `frontal view` → vue de face\n- `side view` → vue de profil\n- `three-quarter view` → vue trois-quarts\n- `from behind / back view` → vu(e) de dos\n- `top-down view` → vue en plongée\n- `low-angle view` → contre-plongée\n- `bird's eye view` → vue aérienne\n- `worm's eye view` → vue d'en bas\n- `tilted view` → angle incliné\n\n## Compositions classiques\n- `silhouette in the foreground` → silhouette au premier plan\n- `figure in the center` → personnage au centre\n- `view framed by archways` → vue encadrée par des arches\n- `background fading into mist` → arrière-plan noyé dans la brume\n- `path leading into the distance` → chemin menant vers l'horizon\n- `small figure dwarfed by scenery` → silhouette écrasée par le décor\n- `reflected in water or mirror` → reflété dans l'eau ou un miroir\n\n---\n\n## Astuce finale\n**Tu es la caméra.** Pose-toi ces questions :\n- Est-ce que je suis proche ?\n- Est-ce que je regarde d'en haut, d'en bas, de côté ?\n- Qu'est-ce que je veux que le spectateur voie **en premier** ?\n"},"CORE_fins-prompt-globales.md":{"file":"CORE_fins-prompt-globales.md","titleFr":"Modificateurs de fin de prompt","titleEn":"End-of-prompt quality modifiers","groupFr":"Fiches essentielles","groupEn":"Essential notes","descFr":"Le socle ICHKA : tension visuelle, lumière, cadrage et finitions de prompt.","descEn":"The ICHKA foundation: visual tension, light, framing and prompt finishing touches.","markdown":"---\ntitle: \"Super Fiche – Fins de prompt globales MJ v7\"\ncategorie: PROMPT\nsous-theme: Méthode\ntype-doc: Super Fiche\nversion-mj: v7\n---\n\n## Pourquoi les fins de prompt comptent\nLes derniers mots d'un prompt MJ agissent comme des **modificateurs globaux** : ils affectent la tonalité, le rendu, le style et la qualité de l'image entière. Une fin bien choisie peut transformer un prompt ordinaire en image exceptionnelle.\n\n## Fins universelles haute qualité\n\n### Qualité & rendu\n- award-winning photography\n- masterpiece, best quality\n- hyperrealistic, ultra-detailed\n- sharp focus, high resolution\n- editorial quality\n- professional studio lighting\n- rendered in Octane / Unreal Engine 5\n\n### Atmosphère & émotion\n- cinematic mood\n- dramatic lighting\n- moody and atmospheric\n- ethereal and dreamlike\n- golden hour light\n- dark and mysterious\n\n### Style artistique global\n- in the style of [artiste ou mouvement]\n- painterly aesthetic\n- film grain, analog feel\n- vintage aesthetic\n- timeless elegance\n\n## Fins par type d'image\n\n### Portrait / Personnage\n- shallow depth of field\n- bokeh background\n- subject in focus\n- natural skin texture\n- expressive eyes, intense gaze\n- 3/4 portrait lighting\n\n### Paysage / Environnement\n- vast and epic landscape\n- sense of scale and grandeur\n- atmospheric perspective\n- golden ratio composition\n- rule of thirds\n\n### Concept art / Illustration\n- concept art style\n- intricate details\n- lore-rich environment\n- fantasy world-building\n- game art aesthetic\n\n### Photographie réaliste\n- shot on Canon EOS R5\n- 35mm lens, f/1.8\n- natural light photography\n- documentary style\n- photojournalism aesthetic\n\n## Fins pour booster la créativité\n- trending on ArtStation\n- featured on Behance\n- award-winning digital art\n- museum-quality artwork\n- gallery-worthy composition\n- viral aesthetic\n\n## Combinaisons efficaces testées\n\n**Portrait cinématique :**\n→ `cinematic lighting, shallow DOF, award-winning photography, 8K`\n\n**Illustration épique :**\n→ `concept art, intricate details, trending on ArtStation, dramatic lighting`\n\n**Photo réaliste :**\n→ `shot on Sony A7R IV, 85mm lens, natural light, sharp focus, editorial quality`\n\n**Ambiance mystérieuse :**\n→ `moody atmosphere, film grain, dark and cinematic, analog feel, masterpiece`\n\n## Fins à éviter\n- high quality *(trop générique)*\n- beautiful *(subjectif, peu d'effet)*\n- nice colors *(vague)*\n- good lighting *(vague)*\n"},"VOCAB_expressions.md":{"file":"VOCAB_expressions.md","titleFr":"Expressions humaines","titleEn":"Human expressions","groupFr":"Sujet humain & personnage","groupEn":"Human subject & character","descFr":"Expressions, corps, attitudes, cheveux, action, archétypes et détails sensibles.","descEn":"Expressions, bodies, posture, hair, action, archetypes and delicate details.","markdown":"---\ntitle: \"Expressions & visages — Vocabulaire complet\"\ncategorie: VOCAB\nsous-theme: Expressions\ntype-doc: Super Fiche\nversion-mj: Général\n---\n\n## Principe fondamental\n\nMidjourney ne sait pas *\"elle est triste\"* — il sait **ce que font les yeux, la bouche, les sourcils, la peau**. Une expression réussie n'est pas un adjectif, c'est une **sculpture immobile** : on décrit chaque élément du visage.\n\n**Structure recommandée** : `[SUJET] + [expression ou caractéristique] + [détail des traits]`\n\n---\n\n## 1. Éléments du visage (vocabulaire de base)\n\n`eyes` (yeux) · `mouth` (bouche) · `lips` (lèvres) · `eyebrows` (sourcils) · `cheeks` (joues) · `forehead` (front) · `chin` (menton) · `jawline` (mâchoire) · `nose` (nez) · `temples` · `eyelids` (paupières) · `skin` (peau)\n\n---\n\n## 2. Micro-expressions atomiques (briques de base)\n\n| Expression EN | FR |\n|---|---|\n| `smiling slightly` | sourire léger |\n| `frowning` | sourcils froncés |\n| `crying silently` | pleurer en silence |\n| `gazing upward` | regard vers le haut |\n| `narrowed eyes` | yeux plissés |\n| `wide-eyed` | yeux écarquillés |\n| `mouth open slightly` | bouche entrouverte |\n| `tight-lipped` | lèvres serrées |\n| `pursed lips` | lèvres pincées |\n| `raised eyebrows` | sourcils levés |\n| `furrowed brow` | front plissé |\n| `blank expression` | expression neutre |\n| `clenched jaw` | mâchoire serrée |\n| `soft features` | traits doux |\n| `sunken eyes` | yeux enfoncés |\n| `wrinkled face` | visage ridé |\n| `scarred cheek` | joue cicatrisée |\n| `freckles` | taches de rousseur |\n\n---\n\n## 3. Émotions complètes (combos prêts à l'emploi)\n\n### Anger / Colère\n- `a face twisted in an expression of rage`\n- `brows knitted hard, nostrils flared, eyes blazing`\n- `clenched jaw, teeth bared, lips pulled tight`\n- `a cold, controlled glare with thin pressed lips`\n\n### Fear / Terreur\n- `eyes wide and glassy, mouth open in a silent scream`\n- `trembling lips, breath caught, pupils dilated`\n- `a haunted stare with dark rings around the eyes`\n\n### Sadness / Tristesse\n- `tear-filled eyes and a downturned mouth`\n- `a mournful gaze cast downward`\n- `a quiet sob with wet lashes and flushed nose`\n\n### Joy / Joie\n- `bright eyes and a radiant, open smile`\n- `a laughing mouth with parted lips and shining teeth`\n- `an exuberant laugh, head slightly thrown back`\n\n### Surprise / Shock\n- `eyes wide open, brows arched high, mouth in an O`\n- `a stunned face with slack jaw and fixed stare`\n\n### Disgust / Dégoût\n- `a wrinkled nose and a curled upper lip`\n- `a sour look with lifted upper lip and narrowed eyes`\n\n### Contempt / Mépris / Supériorité\n- `a one-sided smirk with a raised corner of the mouth`\n- `an arched eyebrow and a dismissive gaze`\n\n### Confidence / Fierté\n- `a steady, level gaze and a firm jawline`\n- `chin lifted, eyes bright, posture open`\n\n### Determination / Détermination\n- `narrowed eyes and a locked jaw`\n- `a battle-ready expression with taut cheek muscles`\n\n### Focus / Concentration\n- `a fixed gaze with slightly narrowed lids`\n- `brows drawn together in a tight line`\n\n### Curiosity / Intrigue\n- `a tilted head with a questioning brow`\n- `bright, searching eyes and gently parted lips`\n\n### Desire / Désir\n- `half-lidded eyes with relaxed, parted lips`\n- `a magnetic stare with slightly raised brows`\n\n### Awe / Émerveillement\n- `shining eyes and a breathless, open mouth`\n- `an enchanted gaze with widened pupils`\n\n### Madness / Folie\n- `wide, gleaming eyes and a grotesque grin`\n- `an off-kilter head tilt with a too-wide smile`\n\n### Nostalgia / Melancholy\n- `a soft, distant smile and misty eyes`\n- `a bittersweet half-smile with lowered lids`\n\n### Serenity / Sérénité\n- `relaxed lids and a soft, small smile`\n- `tranquil eyes with a peaceful gaze`\n\n### Stoic / Stoïcisme\n- `expressionless features and steady eyes`\n- `a calm mask with minimal micro-movement`\n\n### Mischief / Malice / Ruse\n- `a sly grin and a glint in the eyes`\n- `a foxlike smile with lifted eyebrows`\n\n### Pain / Douleur\n- `a face twisted in a grimace of pain`\n- `clenched teeth, eyes squeezed shut`\n\n### Relief / Soulagement\n- `a slackened jaw and a soft exhale`\n- `a grateful, gentle gaze`\n\n---\n\n## 4. Traits composés (visage entier)\n\n- `a calm expression with soft eyes`\n- `a tired face with dark under-eyes`\n- `a smiling mouth with sharp teeth`\n- `a young woman with flushed cheeks`\n- `a man with a broken nose and a haunted gaze`\n\n---\n\n## 5. Styles de visage / morphologie\n\n`round face` · `angular face` · `gaunt face` · `broad jaw` · `sharp cheekbones` · `wrinkled skin` · `smooth skin` · `scarred face` · `glowing eyes` · `mechanical jaw` · `porcelain-like skin` · `glitching features`\n\n---\n\n## 6. Erreurs fréquentes à corriger\n\n| ❌ Vague | ✅ Précis |\n|---|---|\n| \"visage mystérieux\" | `blank expression with deep-set eyes and faint shadows` |\n| \"air pensif\" | `furrowed brow, lips parted, gaze cast downward` |\n| \"expression intense\" | `narrowed eyes, clenched jaw, teeth showing` |\n| \"elle a l'air triste\" | `tear-filled eyes and a downturned mouth, gaze cast downward` |\n| \"il est en colère\" | `brows knitted hard, nostrils flared, jaw clenched` |\n\n---\n\n> **Règle d'or** : l'expression faciale est une **sculpture immobile**.\n> Décris ce que fait chaque partie du visage, jamais l'émotion ressentie.\n"},"VOCAB_attitude-corporelle.md":{"file":"VOCAB_attitude-corporelle.md","titleFr":"Attitude corporelle","titleEn":"Body attitude and posture","groupFr":"Sujet humain & personnage","groupEn":"Human subject & character","descFr":"Expressions, corps, attitudes, cheveux, action, archétypes et détails sensibles.","descEn":"Expressions, bodies, posture, hair, action, archetypes and delicate details.","markdown":"---\ntitle: \"Mouvements visuels\"\ncategorie: COMP\nsous-theme: Mouvements\ntype-doc: Fiche\nversion-mj: v7\n---\n\n## I. Postures debout expressives\n\n| Type de posture | Expression utilisable | Effet déclenché |\n|---|---|---|\n| Posture royale / fière | `standing tall with chest lifted and chin slightly raised` | Autorité silencieuse |\n| Posture relâchée | `standing loosely with weight on one hip, shoulders lowered` | Allure tranquille |\n| Appui sur un objet | `standing with one hand resting on a cane or rail, body slightly tilted` | Pause visuelle |\n| Tension statique | `standing with fists clenched and back slightly arched` | Énergie contenue |\n| Posture inquiète | `standing with arms folded tightly, shoulders hunched inward` | Fermeture corporelle |\n\n## II. Mouvements des mains (et bras)\n\n| Geste | Expression utilisable | Ce que MJ en déduit |\n|---|---|---|\n| Geste ouvert | `hands outstretched gently, fingers slightly spread` | Invitation, douceur |\n| Geste nerveux | `fingers intertwined in front of the body` | Stress, doute |\n| Main vers le ciel | `one arm lifted upward, palm open` | Espoir, appel |\n| Bras en arrière | `arms clasped behind the back` | Maîtrise, formalité |\n| Main sur le cœur | `right hand placed over the chest` | Émotion, sincérité |\n| Mains dans le tissu | `hands brushing over flowing fabric` | Grâce, flottement |\n| Doigts dans l'air | `fingers trailing softly through the air` | Mouvement léger, rêveur |\n\n## III. Poses masculines / animales / épiques\n\n| Type de pose | Expression utilisable | Ce que ça génère |\n|---|---|---|\n| Guerrier prêt au combat | `standing in a wide stance, knees slightly bent, sword drawn at shoulder level` | Tension, affrontement |\n| Force contenue | `crouched low with shoulders tense and muscles flexed` | Animalité, énergie brute |\n| Puissance calme | `arms crossed over broad chest, gaze fixed forward` | Domination silencieuse |\n| Bond imminent | `one foot forward, arms drawn back, posture coiled` | Attente explosive |\n| Posture divine | `body extended upward, arms lifted symmetrically, drapery flowing` | Majesté, légende |\n| Posture prédatrice | `crouched with fingers spread on the ground, eyes low, spine arched` | Tension animale |\n| Conquête / triomphe | `standing on a rock or hilltop with arms extended and chest forward` | Héros victorieux |\n\n---\n\n## Exemples prêts à coller\n\n**Posture féminine détendue :**\n`A woman standing loosely with one hip tilted, arms folded behind her back, head slightly bowed, in soft morning light.`\n\n**Geste dramatique masculin :**\n`A man in a dark coat standing tall, one hand raised toward the sky, fingers spread, his other hand clenched over his heart.`\n\n**Pose animale mythique :**\n`A massive feline creature crouched low, spine arched, claws spread over ancient stone, ready to pounce, its gaze fixed in golden mist.`\n"},"VOCAB_anti-mains-ratees.md":{"file":"VOCAB_anti-mains-ratees.md","titleFr":"Astuces anti-mains ratées","titleEn":"Avoiding broken hands","groupFr":"Sujet humain & personnage","groupEn":"Human subject & character","descFr":"Expressions, corps, attitudes, cheveux, action, archétypes et détails sensibles.","descEn":"Expressions, bodies, posture, hair, action, archetypes and delicate details.","markdown":"---\ntitle: \"Astuces anti-mains ratées\"\ncategorie: VOCAB\nsous-theme: Autre\ntype-doc: Fiche\nversion-mj: Général\n---\n\n## 1. Gants — Formulations fiables\n- `wearing form-fitting gloves made of matte leather` — gants moulants en cuir mat\n- `long ceremonial gloves with fine embroidery at the cuffs` — gants longs cérémoniels brodés\n- `dark gloves with reinforced knuckles and smooth surface` — gants sombres renforcés\n- `hands fully gloved, fingertips barely visible under fabric folds` — mains gantées, bouts de doigts à peine visibles\n- `silken gloves that obscure finger detail, minimalist finish` — gants de soie qui dissimulent les doigts\n\n## 2. Mains stylisées — Surnaturelles ou abstraites\n- `porcelain hands with visible cracks, smooth and fragile`\n- `skeletal hands with elongated fingers, stylized anatomy`\n- `metallic hands with sharp segments and polished joints`\n- `translucent crystal hands glowing faintly from within`\n- `gloved hands made of swirling smoke and light`\n\n## 3. Poses de sécurité — Stabiliser ou cacher\n- `arms crossed, hands partially hidden under the sleeves`\n- `hands folded behind the back, not visible from the front`\n- `hands inside long flowing sleeves, obscured by fabric`\n- `one hand holding a staff, the other obscured by a cloak`\n- `hands resting on an object, fingers aligned and stylized`\n\n## 4. Accessoires occupants — Détourner ou masquer\n- `holding a glowing orb with fingers curled around it`\n- `gripping the edge of a cloak with tension in the fingers`\n- `hands covered by ritual bindings or golden wrappings`\n- `carrying an intricate book with hands partially visible`\n- `hands suspended in smoke, partially obscured`\n\n## 5. Techniques compositionnelles\n- `low lighting hides the hands in soft shadow`\n- `frame cropped above the wrists` (plan américain haut)\n- `positioned behind objects or elements in the foreground`\n- `dramatic silhouette with no finger detail visible`\n- `hands blurred in motion`\n\n## 6. Post-génération\n- Utiliser **Remix** ou **Vary Region** → masquer les mains localement.\n- Éviter le zoom arrière extrême → plus de risques d'erreurs anatomiques.\n- Utiliser des poses photographiques connues : `arms crossed`, `resting on cane`.\n\n## Mini-suffixes à coller en fin de prompt\n- `hands hidden inside long ceremonial sleeves, pose minimal`\n- `gloved hands holding an artifact, fingers stylized`\n- `arms folded, no visible hand detail`\n- `fingers obscured by fabric and shadow`\n- `one hand exposed, holding a glowing orb, the other hidden`\n"},"VOCAB_corps-vocabulaire.md":{"file":"VOCAB_corps-vocabulaire.md","titleFr":"Corps humain — vocabulaire","titleEn":"Human body vocabulary","groupFr":"Sujet humain & personnage","groupEn":"Human subject & character","descFr":"Expressions, corps, attitudes, cheveux, action, archétypes et détails sensibles.","descEn":"Expressions, bodies, posture, hair, action, archetypes and delicate details.","markdown":"---\ntitle: \"Corps humain — Vocabulaire complet\"\ncategorie: VOCAB\nsous-theme: Corps\ntype-doc: Super Fiche\nversion-mj: Général\n---\n\n## 1. Morphologies / Corpulences\n\n### Silhouettes fines\n- **slim** → mince, fin(e)\n- **skinny** → très maigre\n- **lean** → sec, affûté (plus sportif que `skinny`)\n\n### Silhouettes athlétiques\n- **athletic build** → silhouette athlétique\n- **fit** → en forme, musclé(e) sans excès\n- **toned** → tonique, définition musculaire\n- **muscular** → musclé(e), visible mais pas extrême\n- **ripped / shredded** → très sec, muscles dessinés\n\n### Silhouettes fortes\n- **stocky** → trapu, compact\n- **burly** → costaud, massif\n- **broad-shouldered** → larges épaules\n\n### Silhouettes rondes / pleines\n- **curvy** → formes généreuses (souvent féminin)\n- **plump** → rondelet(te), légèrement enrobé(e)\n- **chubby** → joufflu(e), dodu(e), amical\n- **full-figured** → silhouette généreuse, pulpeuse\n- **plus-size** → grande taille, corpulence forte\n\n### Silhouettes corpulentes\n- **large** → grand(e) et imposant(e)\n- **heavyset** → corpulent(e), trapu(e)\n- **overweight** → en surpoids\n- **obese** → obèse (très fort visuellement pour MJ)\n\n---\n\n## 2. Posture & silhouette générale\n\n- `athletic figure` — silhouette athlétique\n- `sculpted form` — forme sculptée\n- `elongated limbs` — membres allongés\n- `upright posture` — posture droite\n- `bent at the waist` — penché au niveau de la taille\n- `crouching position` — position accroupie\n- `body in motion` — corps en mouvement\n- `body mid-leap` — corps en plein saut\n- `torso twisted in motion` — torse tourné dans le mouvement\n- `arms extended outward` — bras tendus vers l'extérieur\n\n---\n\n## 3. Rendu de peau (vocabulaire sécurisé MJ)\n\n- `pale skin tones` — tons de peau pâles\n- `sunlit skin` — peau éclairée par le soleil\n- `luminous surface texture` — texture lumineuse\n- `skin faintly glistening` — peau légèrement scintillante\n- `subtle skin texture` — grain de peau subtil\n- `matte skin finish` — finition mate\n- `skin glowing in cold light` — peau luisante sous lumière froide\n- `barely visible skin under shadow` — peau à peine visible dans l'ombre\n\n---\n\n## 4. Expressions corporelles non-censurables\n\nFormules à privilégier pour décrire un mouvement/corps sans déclencher les filtres MJ :\n\n- `captured mid-motion` — saisi en plein mouvement\n- `body framed by natural light` — corps encadré par la lumière naturelle\n- `silhouetted in front of a bright backdrop` — silhouette devant un fond lumineux\n- `weight shifting from one leg` — poids déplacé sur une jambe\n- `gaze directed toward the sky` — regard dirigé vers le ciel\n- `movement frozen mid-air` — mouvement figé en plein vol\n\n---\n\n## 5. Plans & cadrages corporels\n\n- `full body shot` — vue complète du corps\n- `upper body shot` — plan buste\n- `medium shot` — plan américain (jusqu'aux cuisses)\n- `extreme close-up` — très gros plan (visage ou détail)\n\n---\n\n## 6. Exemples combinés prêts à coller\n\n```\nA slim woman in a full body shot, neutral pose, plain background.\n```\n\n```\nAn overweight man in a medium shot, standing, cinematic lighting.\n```\n\n```\nA curvy female warrior in leather armor, holding a sword, dramatic fantasy style.\n```\n\n```\nA muscular barbarian with broad shoulders, holding a massive axe, ultra-detailed textures.\n```\n\n```\nAn athletic figure captured mid-motion, body framed by natural light, weight shifting from one leg.\n```\n"},"VOCAB_corps-surpoids.md":{"file":"VOCAB_corps-surpoids.md","titleFr":"Décrire les corps en surpoids","titleEn":"Describing larger bodies","groupFr":"Sujet humain & personnage","groupEn":"Human subject & character","descFr":"Expressions, corps, attitudes, cheveux, action, archétypes et détails sensibles.","descEn":"Expressions, bodies, posture, hair, action, archetypes and delicate details.","markdown":"---\ntitle: \"Décrire les corps en surpoids\"\ncategorie: VOCAB\nsous-theme: Corps\ntype-doc: Fiche\nversion-mj: v7\n---\n\nBut : Obtenir des corps crédibles, expressifs, variés, sans déformation absurde.\nMJ comprend mieux les expressions visuelles descriptives que les adjectifs abstraits (`fat`, `obese` → peu fiables seuls). Décrire : le volume, la forme, la tenue corporelle, la présence.\n\n## 1. Termes d'ensemble\n| Terme visuel | Ce que MJ génère |\n|---|---|\n| heavyset | Silhouette large, trapue mais stable |\n| broad-bodied | Carrure massive, épaules et hanches larges |\n| round figure | Formes douces, ventre marqué |\n| full-figured | Corps généreux avec posture assumée (très utile pour femmes) |\n| plump-bodied | Plus doux et compact, styles illustrés |\n| thick build | Grosse ossature, musculature mêlée de graisse |\n\n## 2. Zones à décrire\n| Zone | Expressions utiles |\n|---|---|\n| Ventre | soft stomach · rounded belly · visible belly fold |\n| Bras | thick upper arms · fleshy arms · soft forearms |\n| Visage | rounded cheeks · double chin · soft jawline |\n| Jambes | broad thighs · wide calves · thick legs |\n| Mains | short fingers · thick knuckles · wide palms |\n\n## 3. Postures qui fonctionnent bien\n| Posture | Description |\n|---|---|\n| Assise stable | seated firmly with arms resting on the belly or knees |\n| Debout naturel | standing with relaxed posture, arms at sides, weight evenly distributed |\n| En mouvement fluide | walking with slow steps, soft fabric moving with the body |\n\n## 4. Tenues compatibles\n| Tenue | Effet |\n|---|---|\n| Loose tunic or flowing shirt | Évite les artefacts sur les silhouettes amples |\n| Waistcoat over soft shirt | Structure visuelle intéressante, stable en image |\n| Casual soft dress with waist gathered under the chest | Excellent pour silhouettes féminines |\n| Belt slightly buried in the belly | Lisibilité du volume ventral |\n| Suspenders over rounded belly | Style rétro ou narratif |\n\n## Exemple de prompt bien formulé\n`A full-figured man with broad shoulders and a rounded belly, standing relaxed in a loose linen shirt and suspenders, his hands resting on his hips, soft shadows emphasizing the folds of his clothes.`\n"},"VOCAB_cheveux.md":{"file":"VOCAB_cheveux.md","titleFr":"Cheveux, formes, styles et couleurs","titleEn":"Hair, shapes, styles and colors","groupFr":"Sujet humain & personnage","groupEn":"Human subject & character","descFr":"Expressions, corps, attitudes, cheveux, action, archétypes et détails sensibles.","descEn":"Expressions, bodies, posture, hair, action, archetypes and delicate details.","markdown":"---\ntitle: \"Cheveux — Vocabulaire complet\"\ncategorie: VOCAB\nsous-theme: Cheveux\ntype-doc: Super Fiche\nversion-mj: Général\n---\n\n## 1. Longueur\n\n### Très courts / rasés\n- `buzz cut` — coupe rasée très courte\n- `shaved head` / `bald head` — tête rasée\n- `skin fade` — dégradé à blanc\n- `ultra short crop` — coupe très courte structurée\n- `pixie cut` — coupe pixie courte effilée\n\n### Carrés (bobs)\n- `short bob` — carré court\n- `blunt bob` — carré droit net\n- `asymmetrical bob` — carré asymétrique\n\n### Mi-longs\n- `shoulder-length hair` — cheveux aux épaules\n- `layered mid-length cut` — mi-longue dégradée\n- `wolf cut` — coupe loup dégradée volumineuse\n\n### Longs\n- `flowing long hair` — cheveux fluides en mouvement\n- `waist-length hair` — jusqu'à la taille\n- `floor-length hair` — jusqu'au sol\n- `ultra long straight hair` — très longs raides\n\n---\n\n## 2. Texture\n\n- `pin straight hair` — parfaitement lisses\n- `straight sleek hair` — lisses brillants\n- `glass hair finish` — effet miroir ultra brillant\n- `wavy hair` — ondulés\n- `soft beach waves` — ondulations souples effet plage\n- `vintage Hollywood waves` — ondulations glamour rétro\n- `loose curls` — boucles lâches\n- `natural curls` — boucles naturelles\n- `tight curls` / `tight coils` — boucles serrées\n- `voluminous curls` — boucles volumineuses\n- `afro hair` / `kinky curls` — cheveux afro\n- `sculpted afro shape` — afro structuré\n- `messy hair` / `bedhead` — décoiffés\n- `styled hair` / `gelled spikes` / `slicked back` — coiffés/gelés\n- `voluminous hair` / `fluffy hair` — volumineux\n\n---\n\n## 3. Structure de coupe\n\n- `feathered layers` — dégradé léger effilé\n- `choppy layers` — dégradé irrégulier texturé\n- `blunt cut ends` — pointes coupées nettes\n- `asymmetrical haircut` — coupe asymétrique\n- `side undercut` — côté rasé\n\n---\n\n## 4. Frange (bangs)\n\n- `straight bangs` / `blunt bangs` — frange droite épaisse\n- `side bangs` — frange sur le côté\n- `curtain bangs` — frange rideau\n- `micro bangs` — micro-frange très courte\n- `wispy bangs` — frange légère effilée\n\n---\n\n## 5. Tresses & attaches\n\n### Tresses\n- `single braid` — tresse simple\n- `twin braids` — deux tresses\n- `french braid` — tresse française\n- `fishtail braid` — tresse épi de blé\n- `cornrows` — tresses plaquées\n- `box braids` — tresses longues individuelles\n- `braided crown` — couronne tressée\n\n### Queues / chignons\n- `high ponytail` — queue haute\n- `low ponytail` / `sleek low ponytail` — queue basse lisse\n- `side ponytail` — queue latérale\n- `messy bun` — chignon flou\n- `tight bun` — chignon serré\n- `braided bun` — chignon tressé\n- `twisted updo` — coiffure torsadée attachée\n\n### Coupes structurées\n- `mohawk` / `spiky mohawk` — crête\n\n---\n\n## 6. Effets de styling\n\n- `high volume hair` — cheveux très volumineux\n- `wet hair effect` — effet cheveux mouillés\n- `wind-swept hair` — cheveux balayés par le vent\n- `messy textured hair` — coiffure décoiffée texturée\n\n---\n\n## 7. Couleurs\n\n### Naturelles\n- **Noirs** : `black`, `jet black hair`\n- **Bruns** : `dark brown`, `light brown`\n- **Blonds** : `blonde`, `dirty blonde`, `platinum blonde`, `golden blonde`, `ash blonde`\n- **Roux** : `red`, `ginger`, `auburn`, `copper red hair`\n- **Gris/blancs** : `grey`, `silver`, `white`\n\n### Effets de coloration\n- `balayage highlights` — mèches balayage\n- `ombre hair` / `dip-dyed` — dégradé ombré\n\n### Fantaisie\n- **Bleus** : `pastel blue`, `deep navy`\n- **Verts** : `emerald green`, `neon green`\n- **Violets** : `lavender`, `deep violet`\n- **Roses** : `pastel pink hair`, `rose`, `hot pink`\n- **Spéciaux** : `silver metallic hair`, `rainbow`\n\n---\n\n## 8. Matières fantastiques\n\n### Cristallin / minéral\n`crystal hair` · `glass hair` · `gemstone hair` · `obsidian hair` · `diamond hair` · `quartz hair` · `amethyst hair` · `sapphire hair` · `ruby hair` · `emerald hair` · `volcanic rock hair` · `geode hair` · `ice-crystal hair`\n\n### Éléments naturels\n`flame hair` · `smoke hair` · `water hair` · `ice hair` · `cloud hair` · `storm hair` · `lightning hair` · `sand hair` · `lava hair` · `ash hair` · `moss hair` · `leaf hair` · `flower petal hair` · `vine hair` · `tree bark hair`\n\n### Métal / industriel\n`metallic hair` · `steel hair` · `gold hair` · `copper hair` · `chain hair` · `bronze hair` · `titanium hair` · `chrome hair` · `rusted iron hair` · `liquid mercury hair` · `wire hair` · `gear hair` · `blade hair`\n\n### Insolite / surnaturel\n`bubblegum hair` · `candy hair` · `slime hair` · `cotton candy hair` · `neon light hair` · `holographic hair` · `glowing hair` · `rainbow fire hair` · `starlight hair` · `galaxy hair` · `nebula hair` · `smoke and ember hair` · `frost hair` · `shadow hair` · `lightbeam hair` · `plasma hair` · `honey hair` · `glass shard hair` · `crystal shard hair` · `digital pixel hair` · `glitch hair`\n\n---\n\n## Phrase modèle\n\n`A character with [forme/longueur], styled as [texture/structure], with [matière fantastique ou couleur].`\n\n**Exemple** : `A character with shoulder-length hair, styled as soft beach waves, with copper red hair and wispy bangs.`\n"},"VOCAB_mouvements-action.md":{"file":"VOCAB_mouvements-action.md","titleFr":"Mouvements d'action","titleEn":"Action movements","groupFr":"Sujet humain & personnage","groupEn":"Human subject & character","descFr":"Expressions, corps, attitudes, cheveux, action, archétypes et détails sensibles.","descEn":"Expressions, bodies, posture, hair, action, archetypes and delicate details.","markdown":"---\ntitle: \"20 mouvements d'action\"\ncategorie: VOCAB\nsous-theme: Mouvements\ntype-doc: Fiche\nversion-mj: Général\n---\n\nRemplace `[CHARACTER]` par : `barbarian warrior`, `samurai swordsman`, `female assassin with daggers`, `cybernetic knight`, etc.\n\n---\n\n**1. Charge en avant**\n`[CHARACTER] charging forward at full speed, weapon raised, debris and dust flying from the ground, hair and clothes streaming backward. Dynamic low-angle cinematic perspective, ultra-detailed textures. In the style of Greg Rutkowski.`\n\n**2. Bond héroïque**\n`[CHARACTER] leaping high through the air, frozen in mid-motion, hair and fabric whipping in the wind, energy trails following the weapon. Three-quarter perspective, cinematic epic fantasy lighting.`\n\n**3. Coup vertical**\n`[CHARACTER] delivering a powerful downward strike with a massive weapon, arms tense, ground cracking beneath their feet. Cinematic dramatic lighting, dust and debris flying.`\n\n**4. Coup circulaire**\n`[CHARACTER] swinging a weapon in a wide circular arc, sparks and motion blur around the blade, body twisting dynamically. Dutch angle composition, cinematic heroic fantasy.`\n\n**5. Saut depuis une falaise**\n`[CHARACTER] jumping from a high ledge into battle, arms extended, hair flowing, rocks and dust falling around. Epic cinematic scale, dramatic lighting.`\n\n**6. Esquive latérale**\n`[CHARACTER] dodging sideways with extreme agility, body bent low, energy trails marking the speed of movement. Cinematic close-up dynamic action shot.`\n\n**7. Blocage héroïque**\n`[CHARACTER] blocking a massive attack with weapon or shield, sparks exploding at the point of contact, ground shaking beneath them. Low-angle heroic fantasy composition.`\n\n**8. Combat rapproché**\n`[CHARACTER] grappling in close combat, arms locked in struggle, muscles tense, sweat and rain dripping, cinematic lighting with high contrast.`\n\n**9. Double saut**\n`[CHARACTER] performing a twisting jump with weapon raised, body suspended in mid-air, dust and debris exploding below. Three-quarter dramatic perspective.`\n\n**10. Décharge d'énergie**\n`[CHARACTER] unleashing a blast of energy from their hands, glowing light beams radiating outward, hair and cloth lifted by the force. Dynamic cinematic composition with radiant lighting.`\n\n**11. Impact au sol**\n`[CHARACTER] slamming a weapon into the ground, shockwaves cracking the earth, rocks and dust flying in all directions. Cinematic epic fantasy style.`\n\n**12. Charge montée**\n`[CHARACTER] charging forward while riding a creature, weapon raised, wind and debris rushing past. Cinematic motion blur and dramatic fantasy lighting.`\n\n**13. Combat aérien**\n`[CHARACTER] locked in mid-air combat, weapons clashing, sparks flying, bodies suspended as if weightless. Epic cinematic heroic fantasy composition.`\n\n**14. Frappe ascendante**\n`[CHARACTER] delivering an upward strike, sparks and debris flying, body twisting with raw power. Cinematic Dutch angle, ultra-detailed action scene.`\n\n**15. Course à pleine vitesse**\n`[CHARACTER] sprinting forward at full speed, ground breaking beneath their steps, dust clouds trailing behind, clothes streaming. Cinematic low-angle heroic fantasy style.`\n\n**16. Projection d'ennemi**\n`[CHARACTER] throwing an enemy with immense force, body twisted, motion blur and debris surrounding the scene. Cinematic action shot with high contrasts.`\n\n**17. Esquive acrobatique**\n`[CHARACTER] flipping backward in mid-air, weapon raised, body arched dramatically, sparks and debris flying around. Epic cinematic heroic fantasy composition.`\n\n**18. Impact explosif**\n`[CHARACTER] striking an enemy with such force that shockwaves ripple outward, fragments and dust exploding. Cinematic close-up dramatic fantasy style.`\n\n**19. Déluge de projectiles**\n`[CHARACTER] launching a barrage of arrows, bolts, or magic projectiles, glowing trails filling the sky, hair and clothes swept by the wind. Cinematic epic fantasy scale.`\n\n**20. Duel final**\n`[CHARACTER] facing an enemy in a final standoff, weapons raised, ground cracked beneath, dust and energy swirling around. Dramatic cinematic heroic fantasy composition.`\n"},"VOCAB_archetypes-symboliques.md":{"file":"VOCAB_archetypes-symboliques.md","titleFr":"Archétypes symboliques","titleEn":"Symbolic archetypes","groupFr":"Sujet humain & personnage","groupEn":"Human subject & character","descFr":"Expressions, corps, attitudes, cheveux, action, archétypes et détails sensibles.","descEn":"Expressions, bodies, posture, hair, action, archetypes and delicate details.","markdown":"---\ntitle: \"Fiche Archétypes symboliques – Personnage\"\ncategorie: AUTRE\nsous-theme: Autre\ntype-doc: Fiche\nversion-mj: Général\n---\n\nStructure : **Archétype** → essence visuelle → **formulation sûre à copier**\n\n## TECHNOLOGIQUES / FUTURISTES\n- **Le Technomancien** — a technomancer surrounded by holographic runes and radiant circuitry, blending science and sorcery\n- **Le Chevalier Cybernétique** — a cybernetic knight in chrome armor under blue neon light, symbol of futuristic honor\n- **Le Forgeron d'Énergie** — a cosmic blacksmith shaping weapons of pure energy within glowing smoke\n- **Le Maître du Métal** — a magnetic warlord levitating in a storm of metal shards and light currents\n\n## DIVINS / COSMIQUES\n- **Le Dieu du Tonnerre** — a thunder god summoning lightning through storm clouds and sacred aura\n- **Le Protecteur Céleste** — a celestial guardian flying above clouds bathed in sunlight, symbol of hope\n- **L'Ange Guerrier** — an angelic warrior descending through radiant clouds with shining armor\n- **Le Juge Cosmique** — a colossal cosmic judge surrounded by planetary rings and starlit mist\n\n## OMBRES / ANTI-HÉROS\n- **L'Ombre Vengeresse** — a shadowed vigilante standing under rain and neon light, cape swirling in darkness\n- **Le Revenant Sombre** — a dark revenant cloaked in spectral fire and smoke, symbol of vengeance\n- **Le Clown du Chaos** — a chaotic trickster with painted grin surrounded by neon explosions of color\n- **La Sorcière du Chaos** — a chaos sorceress shaping crimson energy with graceful destructive power\n\n## MAGIQUES / MYSTIQUES\n- **Le Mage de l'Infini** — an infinite mage casting luminous runes in levitating geometric space\n- **Le Tisseur d'Arcanes** — an arcane weaver surrounded by runes of light and drifting manuscripts\n- **La Prophétesse Lumineuse** — a radiant prophetess crowned with alchemical sigils glowing softly in gold\n- **Le Moine Astral** — an astral monk floating in silence within a sphere of starlight\n\n## GUERRIERS / ANTIQUES\n- **Le Gladiateur Mythique** — a mythic gladiator in ancient armor bathed in desert light and dust\n- **La Valkyrie Dorée** — a golden valkyrie descending through clouds with spear of light\n- **Le Barbare Sacré** — a sacred barbarian roaring beneath storm clouds with runic tattoos\n- **Le Gardien Runique** — a rune guardian carved in stone with glowing inscriptions of power\n\n## HYBRIDES / ANIMALIERS\n- **Le Chaman-Faucon** — a falcon shaman cloaked in feathers with wind and sky swirling around\n- **La Reine-Serpent** — a serpent queen with jeweled scales and hypnotic eyes glowing in shadow\n- **Le Loup du Néant** — a cosmic wolf with starlit fur standing over a void horizon\n- **Le Colosse de Racines** — a living giant made of roots and moss radiating soft emerald light\n\n## OCCULTES / SYMBOLIQUES\n- **Le Messager du Néant** — a faceless messenger walking through mist toward a glowing void\n- **Le Maître du Temps** — a timekeeper surrounded by broken clocks and swirling golden dust\n- **Le Porte-Lumière Déchu** — a fallen light-bearer kneeling beneath fractured celestial light\n- **L'Architecte des Rêves** — a dream architect sculpting floating shapes of glass and light in silence\n\n## CHAOTIQUES / POST-APOCALYPTIQUES\n- **Le Guerrier du Néon** — a neon warrior under rain, armor reflecting holographic signs and chaos\n- **Le Vagabond Radioactif** — a radioactive wanderer walking through glowing desert ruins\n- **La Reine des Cendres** — an ashen queen rising among falling embers under crimson light\n- **L'Enfant du Chaos** — a chaotic child surrounded by swirling particles of raw energy\n\n## LUMINEUX / RÉDEMPTIFS\n- **Le Héros Renaissance** — a reborn hero bathed in golden light standing amid quiet ruins\n- **La Gardienne de l'Aube** — a guardian of dawn surrounded by mist and warm sunlight\n- **Le Voyageur Silencieux** — a silent traveler walking through pale desert light, horizon infinite\n- **Le Sauveur d'Ombres** — a savior of shadows emerging from darkness toward radiant light\n\n## Comment utiliser\nCombine deux archétypes pour des résultats riches :\n\"A Technomancer and a Shadow Avenger meet in a cathedral of mirrors.\"\n\"A Valkyrie Golden standing beside a Serpent Queen in a cosmic storm.\"\n"},"VOCAB_tatouages.md":{"file":"VOCAB_tatouages.md","titleFr":"Formulations efficaces pour tatouages","titleEn":"Effective tattoo wording","groupFr":"Sujet humain & personnage","groupEn":"Human subject & character","descFr":"Expressions, corps, attitudes, cheveux, action, archétypes et détails sensibles.","descEn":"Expressions, bodies, posture, hair, action, archetypes and delicate details.","markdown":"---\ntitle: \"Formulations efficaces – Tatouages\"\ncategorie: VOCAB\nsous-theme: Vocabulaire\ntype-doc: Fiche\nversion-mj: Général\n---\n\n## Formulations efficaces\n\n| Formulation | Pourquoi ça marche |\n|---|---|\n| Tattooed skin | Compact et fiable |\n| A tattoo spreads across the chest | Spatialisation claire |\n| Intricate tattoos cover the arms | Bonne lisibilité et effet de surface |\n| Symbols inked into the skin | \"Inked\" = très bien interprété |\n| Black markings etched along the back | Poétique mais clair |\n| A glowing pattern runs along the forearm | Si effet technologique |\n| The chest bears a ritual tattoo | \"Bears\" = langage statique très stable |\n\n## À éviter\n\n| Formulation | Problème |\n|---|---|\n| \"Has a tattoo\" | Trop vague, souvent ignoré |\n| \"Tattooed character\" | MJ comprend parfois \"tatoué\" = style graphique |\n| \"With tattoos\" | Trop imprécis — sans localisation |\n| \"Tattoo is on them\" | Trop flou, pas visuel |\n\n## Astuces de rendu\n- Tatouage + peau : \"fully embedded into the skin\" → évite l'effet flottant\n- Fixité : \"frozen mid-swim\" → évite le mouvement réel, suggère un motif\n- Média encré : \"gold ink tattoo\" → MJ comprend qu'il s'agit de matière sur peau\n- Finition studio : \"Studio Harcourt\" + \"fine skin texture\" → lecture visuelle fine\n"},"VOCAB_verbes-visuels.md":{"file":"VOCAB_verbes-visuels.md","titleFr":"Verbes visuels efficaces","titleEn":"Effective visual verbs","groupFr":"Sujet humain & personnage","groupEn":"Human subject & character","descFr":"Expressions, corps, attitudes, cheveux, action, archétypes et détails sensibles.","descEn":"Expressions, bodies, posture, hair, action, archetypes and delicate details.","markdown":"---\ntitle: \"Verbes visuels efficaces\"\ncategorie: VOCAB\nsous-theme: Vocabulaire\ntype-doc: Fiche\nversion-mj: Général\n---\n\n## Top verbes visuels\n\n### Postures et présence\nse tient · marche · s'assoit · repose · gît · s'appuie · s'accroche\n\n### Apparence et vêtements\nporte · arbore · est vêtu de · couvre · tient · brandit\n\n### Lumière et ambiance\néclaire · illumine · projette · brille · luit · scintille · diffuse\n\n### Environnement et matières\nentoure · recouvre · s'étend · flotte · s'élève · traverse · remplit\n\n### Effets visuels dynamiques (figés comme en photo)\njaillit · explose · tourbillonne · s'enroule · s'écoule · coule · flamboie\n\n## Verbes d'actions fréquents\n\n### Actions du corps\nmarche · court · grimpe · saute · s'accroupit · tombe · s'étend\n\n### Actions avec objets\ntient · pousse · tire · porte · soulève · lance · attrape · frappe · pointe\n\n### Actions de regard / visage\nregarde · fixe · observe · cligne · sourit · crie\n\n### Actions dynamiques / environnement\ntourbillonne · éclate · explose · s'élève · jaillit · s'écoule · traverse\n\n> Tous ces verbes sont utilisables tels quels dans un prompt :\n> `Un guerrier tient une hache.`\n> `Un enfant court dans l'herbe.`\n> `La lave s'écoule entre les rochers.`\n"},"COMP_structures-architecture.md":{"file":"COMP_structures-architecture.md","titleFr":"Structures et architecture","titleEn":"Structures and architecture","groupFr":"Décor, paysage & créatures","groupEn":"Setting, landscape & creatures","descFr":"Pour bâtir un monde autour du sujet : architecture, entités, atmosphère et reflets.","descEn":"Build the world around the subject: architecture, entities, atmosphere and reflections.","markdown":"---\ntitle: \"Structures & architecture\"\ncategorie: COMP\nsous-theme: Composition\ntype-doc: Fiche\nversion-mj: v7\n---\n\n## Pourquoi c'est essentiel ?\nLes structures donnent un **cadre spatial** fort, un **contexte historique ou culturel**, et un **point focal visuel** (pont, arche, tour, trône…).\nMidjourney adore les constructions nettes. Utilise : **forme + style + état + détail**.\n\n---\n\n## Structures fréquentes\n- `tower` — tour\n- `arch` — arche\n- `gate` — portail\n- `bridge` — pont\n- `hall` — salle\n- `courtyard` — cour\n- `dome` — dôme\n- `temple` — temple\n- `cathedral` — cathédrale\n- `sanctuary` — sanctuaire\n- `shrine` — autel\n- `throne room` — salle du trône\n- `stairs / staircase` — escalier\n- `balcony` — balcon\n- `wall` — mur\n- `chamber` — chambre\n- `dungeon` — cachot\n- `corridor` — couloir\n- `tunnel` — tunnel\n- `colonnade` — colonnade\n- `crypt` — crypte\n\n## État / Style / Éléments décoratifs\n- `ruined` — en ruine\n- `crumbling` — délabré(e)\n- `ancient` — ancien(ne)\n- `abandoned` — abandonné(e)\n- `weathered` — érodé(e)\n- `overgrown` — envahi(e) par la végétation\n- `covered in moss` — recouvert(e) de mousse\n- `carved with symbols` — sculpté(e) de symboles\n- `adorned with statues` — orné(e) de statues\n- `sunken` — englouti(e)\n- `floating` — flottant(e)\n- `hollow` — creux\n\n## Formes architecturales intéressantes\n- `arched windows` — fenêtres en arc\n- `gothic spires` — flèches gothiques\n- `vaulted ceiling` — plafond voûté\n- `pillars / columns` — colonnes\n- `round tower` — tour ronde\n- `stepped pyramid` — pyramide à degrés\n- `maze-like structure` — structure labyrinthique\n- `glass dome` — dôme en verre\n- `hanging balcony` — balcon suspendu\n- `underground chamber` — chambre souterraine\n\n---\n\n## Expressions composées utiles\n- `crumbling stone ruins` — ruines de pierre délabrées\n- `a narrow corridor lit by torches` — un couloir étroit éclairé par des torches\n- `a towering black gate` — un portail noir imposant\n- `an ancient temple covered in vines` — un ancien temple couvert de lianes\n- `a spiral staircase in polished marble` — un escalier en spirale en marbre poli\n- `a floating shrine above the water` — un sanctuaire flottant au-dessus de l'eau\n\n---\n\n## Erreurs courantes\n- \"un bâtiment étrange\" → `a crooked tower with arched windows and mossy stone`\n- \"une salle magique\" → `an ancient hall lit by floating orbs and engraved with runes`\n- \"ruines mystérieuses\" → `abandoned sandstone ruins overgrown with roots`\n"},"VOCAB_creatures-entites.md":{"file":"VOCAB_creatures-entites.md","titleFr":"Créatures, animaux et entités","titleEn":"Creatures, animals and entities","groupFr":"Décor, paysage & créatures","groupEn":"Setting, landscape & creatures","descFr":"Pour bâtir un monde autour du sujet : architecture, entités, atmosphère et reflets.","descEn":"Build the world around the subject: architecture, entities, atmosphere and reflections.","markdown":"---\ntitle: \"Créatures, animaux & entités\"\ncategorie: VOCAB\nsous-theme: Créatures\ntype-doc: Fiche\nversion-mj: Général\n---\n\nStructure : `[Type de créature] + [adjectif] + [caractéristiques visuelles] + [matière ou effet]`\n\n## Animaux classiques & sauvages\nwolf · bear · lion · tiger · fox · deer · owl · raven · snake · boar · panther · eagle · hawk · horse · stag\n\n## Créatures fantastiques / hybrides\ndragon · wyvern · griffin · chimera · hydra · phoenix · unicorn · pegasus · kraken · leviathan · wraith · golem · djinn · elemental · shadow beast\n\n## Entités abstraites / cosmiques / étranges\nethereal being · faceless creature · tentacled monster · shapeless horror · floating entity · void-born creature · eye-covered horror · angelic form · eldritch god · celestial serpent · shadowy figure\n\n## Caractéristiques physiques\nhorned · winged · scaled · fanged · clawed · multi-eyed · three-headed · glowing · tentacled · emaciated · shadow-wrapped · bone-armored · fire-coated · smoke-trailing · moss-covered · dripping with blood\n\n## Expressions composées\n- `a serpent with wings and glowing eyes`\n- `a horned beast wrapped in fire`\n- `a faceless entity floating above the ruins`\n- `a four-legged shadow creature with long claws`\n- `a stag with crystal antlers`\n\n## Erreurs courantes\n- ❌ `\"monstre effrayant\"` → ✅ `a massive, three-eyed beast with cracked stone skin`\n- ❌ `\"créature magique\"` → ✅ `a glowing elemental entity with tendrils of mist`\n- ❌ `\"entité cosmique\"` → ✅ `a faceless god made of starlight and shadow`\n\nUne bonne créature = **type + silhouette + texture + traits distinctifs**.\n"},"EFFET_atmospheres.md":{"file":"EFFET_atmospheres.md","titleFr":"Atmosphères et ambiances","titleEn":"Atmospheres and mood","groupFr":"Décor, paysage & créatures","groupEn":"Setting, landscape & creatures","descFr":"Pour bâtir un monde autour du sujet : architecture, entités, atmosphère et reflets.","descEn":"Build the world around the subject: architecture, entities, atmosphere and reflections.","markdown":"---\ntitle: \"Liste complète des atmosphères\"\ncategorie: EFFET\nsous-theme: Atmosphères\ntype-doc: Liste\nversion-mj: Général\n---\n\n## Atmosphères générales / oniriques\n| Anglais | Français | Explication |\n|---|---|---|\n| Ethereal | Éthérée | Impalpable, délicate, presque irréelle |\n| Dreamlike | Onirique | Comme dans un rêve, souvent flou et irrationnel |\n| Surreal | Surréaliste | Étrange, illogique, comme un rêve éveillé |\n| Mystical | Mystique | Envoûtante, pleine de mystère et de magie |\n| Magical | Magique | Féerique, merveilleuse, pleine de charme |\n| Enchanting | Enchanteresse | Captivante, séduisante |\n| Whimsical | Fantaisiste | Légère, amusante, parfois un peu étrange |\n| Cosmic | Cosmique | Vaste, immense, lié à l'univers |\n| Otherworldly | D'un autre monde | Étrange, inhabituel |\n| Sublime | Sublime | Grandiose, impressionnante |\n| Dreamy | Rêveuse | Douce et poétique |\n| Idyllic | Idyllique | Paisible, agréable |\n| Vibrant | Vibrante | Pleine d'énergie, de couleurs et de vie |\n| Dynamic | Dynamique | En mouvement, pleine d'action |\n\n## Atmosphères émotionnelles\n| Anglais | Français | Explication |\n|---|---|---|\n| Peaceful | Paisible | Calme, tranquille |\n| Serene | Sereine | Tranquille, sans perturbation |\n| Tranquil | Tranquille | Calme, paisible |\n| Joyful | Joyeuse | Gaie, pleine de bonheur |\n| Happy | Heureuse | Contente, satisfaite |\n| Excited | Excitée | Enthousiaste, pleine d'énergie |\n| Sad | Triste | Mélancolique, abattue |\n| Melancholic | Mélancolique | Triste, pensive, nostalgique |\n| Lonely | Solitaire | Seule, isolée |\n| Hopeful | Pleine d'espoir | Optimiste, confiante |\n| Despairing | Désespérée | Sans espoir, pessimiste |\n| Anxious | Anxieuse | Inquiète, nerveuse |\n| Content | Contente | Satisfaite, sans besoin de plus |\n| Fearful | Effrayée | Terrifiée, remplie de peur |\n| Angry | En colère | Furieuse, pleine de rage |\n\n## Autres atmosphères\n| Anglais | Français | Explication |\n|---|---|---|\n| Dramatic | Dramatique | Intense, théâtrale |\n| Cinematic | Cinématographique | Comme dans un film |\n| Apocalyptic | Apocalyptique | Catastrophique |\n| Cyberpunk | Cyberpunk | Futuriste, sombre, technologique |\n| Steampunk | Steampunk | Rétrofuturiste |\n| Gothic | Gothique | Sombre, mystérieuse |\n| Romantic | Romantique | Passionnée, sentimentale |\n| Nostalgic | Nostalgique | Regret du passé |\n| Ominous | Menaçante | Inquiétante |\n| Cozy | Confortable | Chaleureuse, accueillante |\n| Intimate | Intime | Proche, personnelle |\n| Tense | Tendue | Nerveuse, pleine de suspense |\n| Chaotic | Chaotique | Désordonnée, confuse |\n| Industrial | Industrielle | Liée à l'industrie |\n| Urban | Urbaine | Liée à la ville |\n| Rural | Rurale | Liée à la campagne |\n"},"EFFET_eaux-reflets.md":{"file":"EFFET_eaux-reflets.md","titleFr":"Eaux, couleurs et reflets","titleEn":"Water, color and reflections","groupFr":"Décor, paysage & créatures","groupEn":"Setting, landscape & creatures","descFr":"Pour bâtir un monde autour du sujet : architecture, entités, atmosphère et reflets.","descEn":"Build the world around the subject: architecture, entities, atmosphere and reflections.","markdown":"---\ntitle: \"Couleurs et Reflets – Fiche Eaux\"\ncategorie: EFFET\nsous-theme: Couleurs\ntype-doc: Fiche\nversion-mj: Général\n---\n\n## 12 types d'eaux avec couleurs et reflets\n\n**1. Lagune tropicale**\nCouleur : turquoise translucide · Reflets : scintillements jade, fond sablonneux visible\n→ `Translucent turquoise with jade sparkles, coral sand visible below`\n\n**2. Océan profond**\nCouleur : bleu encre · Reflets : crêtes gris acier, éclats argentés\n→ `Inky blue with steel-gray crests and silver flickers`\n\n**3. Lac de montagne**\nCouleur : bleu saphir froid · Reflets : miroir de pins et sommets\n→ `Cold sapphire tone with mirror-like reflections of pines and snowy peaks`\n\n**4. Flaques de pluie urbaines**\nCouleur : indigo sale · Reflets : brisés de néons ou ciel gris\n→ `Dirty indigo with shattered reflections of neon or gray sky`\n\n**5. Eau de fonte glaciaire**\nCouleur : turquoise givré · Reflets : volutes cyan laiteuses\n→ `Frosted turquoise with milky cyan swirls under soft light`\n\n**6. Oasis désertique**\nCouleur : vert d'eau limpide · Reflets : nuances ambrées, ombres de roseaux\n→ `Clear teal with amber undertones and reed shadows`\n\n**7. Canal urbain**\nCouleur : vert-gris trouble · Reflets : traînées miroir déformées\n→ `Murky green-gray with distorted mirror streaks of buildings and signs`\n\n**8. Rivière au clair de lune**\nCouleur : gris charbon · Reflets : éclat argenté doux\n→ `Charcoal-gray with soft silver sheen and drifting branch shadows`\n\n**9. Cénote**\nCouleur : noir obsidienne · Reflets : faisceaux émeraude perçants\n→ `Obsidian black with piercing emerald shafts from above`\n\n**10. Source thermale volcanique**\nCouleur : bleu minéral trouble · Reflets : taches orangées, vapeur\n→ `Cloudy mineral blue with orange iron-rich stains and curling steam`\n\n**11. Eaux de fjord**\nCouleur : gris étain · Reflets : nets de falaises et de ciel\n→ `Still pewter gray with crisp reflections of cliffs and sky`\n\n**12. Mer arctique**\nCouleur : cyan terne · Reflets : glace flottante, lumière basse\n→ `Dull cyan scattered with floating ice, lit by low arctic sun`\n"},"COMP_multitude.md":{"file":"COMP_multitude.md","titleFr":"Multitude et foule","titleEn":"Crowds and multitudes","groupFr":"Composition & cadrage avancé","groupEn":"Advanced composition & framing","descFr":"Quand l'image devient plus complexe : foule, panneaux, caméra et sujets multiples.","descEn":"For more complex images: crowds, panels, camera logic and multiple subjects.","markdown":"---\ntitle: \"Super Fiche – Multitude MidJourney v7\"\ncategorie: COMP\nsous-theme: Composition\ntype-doc: Super Fiche\nversion-mj: v7\n---\n\n## Pourquoi c'est difficile\nMidjourney n'aime pas gérer des dizaines de sujets détaillés. En revanche, il gère bien les **masses indistinctes** (silhouettes, ombres, essaims) et les **répétitions visuelles** (rangs, flottes, troupeaux, lanternes).\n\n> **Astuce** : Décrire 1 à 3 sujets principaux nets, et mettre la multitude en arrière-plan / atmosphère.\n\n---\n\n## Mots-clés de multitude\n- `swarm of…` — nuée de…\n- `endless crowd of…` — foule infinie de…\n- `countless silhouettes of…` — silhouettes innombrables de…\n- `vast fleet of…` — immense flotte de…\n- `a sea of…` — une mer de…\n- `towering multitude of…` — multitude imposante de…\n- `infinite rows of…` — rangées infinies de…\n- `countless…` — innombrables…\n\n---\n\n## Par catégorie\n\n**Personnes / armées**\n- `an endless army of armored soldiers fading into the horizon`\n- `countless silhouettes of rebels in a neon city square`\n\n**Monstres / créatures**\n- `a swarm of winged demons circling the sky`\n- `countless giant insects crawling over ruined skyscrapers`\n\n**Animaux / nature**\n- `a vast flock of crows darkening the sky`\n- `a sea of horses running across the plains`\n- `countless jellyfish glowing under the ocean`\n\n**Véhicules / navires**\n- `an endless fleet of pirate ships on stormy seas`\n- `a swarm of futuristic drones over the city`\n\n**Bâtiments / environnements**\n- `infinite rows of neon towers fading into the smog`\n- `a sea of glowing lanterns over the river`\n\n**Paysages / nature étendue**\n- `endless mountain ranges stretching into the mist`\n- `a sea of violet lakes under alien skies`\n\n---\n\n## Astuces pour bien gérer la multitude\n**Filtres qui floutent la masse :** `mist` / `haze` / `fog` / `shadows` / `silhouettes` / `glowing light` → permet d'éviter les visages ou détails ratés.\n**Penser en échelle épique :** `vast`, `colossal`, `endless`, `infinite`, `countless`\n\n---\n\n## Phrase modèle\n`[Main subject in detail], with [multitude of X] fading into mist on the horizon.`\n\n**Exemple :**\n`A single knight in the foreground, an endless army of ghostly warriors fading into the horizon mist.`\n"},"COMP_limite-4-sujets.md":{"file":"COMP_limite-4-sujets.md","titleFr":"Limiter et équilibrer plusieurs sujets","titleEn":"Balancing several main subjects","groupFr":"Composition & cadrage avancé","groupEn":"Advanced composition & framing","descFr":"Quand l'image devient plus complexe : foule, panneaux, caméra et sujets multiples.","descEn":"For more complex images: crowds, panels, camera logic and multiple subjects.","markdown":"---\ntitle: \"Limite de 4 sujets principaux\"\ncategorie: REGLES\nsous-theme: Paramètres\ntype-doc: Guide\nversion-mj: Général\n---\n\n## Définition d'un sujet principal\nUn sujet principal est un élément visuellement dominant dans une composition. Cela englobe : personnes, animaux, créatures, objets actifs et indépendants (robots, véhicules, statues, etc.)\n\n**Ne compte PAS comme sujet principal :** les arrière-plans (ciel, montagnes, forêts), les accessoires ou détails mineurs (tasse, pierre, feuille), la lumière, le brouillard, les reflets ou effets visuels.\n\n## Règle stricte : Maximum 4 sujets principaux\nMidjourney ne peut gérer qu'un maximum de 4 sujets principaux dans une même scène. Si votre composition comporte plus de 2 sujets, il est impératif de les compresser.\n\n## Comment compresser avec la Règle 1/4\n\n**1. Commencer par un archétype de composition :**\nUtiliser une phrase générale pour introduire le groupe.\n`\"Trois personnages marchent dans une ruelle.\"` / `\"Quatre statues encerclent une pierre.\"`\n\n**2. Ancrer chaque sujet avec sa propre phrase :**\n`\"Le premier est un chevalier avec une épée.\"` / `\"Le deuxième est un mage tenant un bâton.\"`\n\n**3. Le groupe entier compte comme un seul sujet compressé.**\nGrâce à cette méthode, 3 ou 4 sujets sont réduits à une seule entité.\n\n**4. Possibilité d'ajouter un sujet secondaire unique :**\nUne silhouette en arrière-plan ou un oiseau au loin.\n\n**5. Plus de 5 sujets ? → STOP**\nMidjourney ne pourra pas les interpréter correctement.\n"},"COMP_divisions-visuelles.md":{"file":"COMP_divisions-visuelles.md","titleFr":"Divisions visuelles et panneaux","titleEn":"Visual divisions and panels","groupFr":"Composition & cadrage avancé","groupEn":"Advanced composition & framing","descFr":"Quand l'image devient plus complexe : foule, panneaux, caméra et sujets multiples.","descEn":"For more complex images: crowds, panels, camera logic and multiple subjects.","markdown":"---\ntitle: \"Divisions visuelles pour prompts\"\ncategorie: COMP\nsous-theme: Composition\ntype-doc: Fiche\nversion-mj: Général\n---\n\n## Multi-panneaux (style comics / storyboard)\n- `multi-panel composition` — composition multi-panneaux\n- `comic-style split panels` — panneaux divisés façon bande dessinée\n- `fragmented storyboard style` — style storyboard fragmenté\n\n## Effets de cadres et découpes\n- `fractured frames` — cadres fracturés\n- `overlapping panels with bold borders` — panneaux superposés avec des bordures marquées\n- `divided illustration with sharp lines` — illustration divisée par des lignes nettes\n\n## Effets artistiques (vitrail / kaléidoscope)\n- `stained-glass panel effect` — effet vitrail en panneaux\n- `shattered glass composition` — composition en verre brisé\n- `kaleidoscope split effect` — effet de division kaléidoscopique\n\n## Effets cinématiques\n- `split-screen cinematic composition` — composition cinématographique en écran divisé\n- `dynamic montage panels` — panneaux de montage dynamique\n\n---\n\n> **Astuce** : Toujours préciser le sujet principal dans le panneau central, et les éléments secondaires dans `side panels` / `surrounding panels`.\n\n**Exemple :**\n`A cybernetic warrior in the central panel, robotic dog and neon city in surrounding panels, multi-panel composition, comic-style split panels, cinematic lighting.`\n"},"COMP_camera-control.md":{"file":"COMP_camera-control.md","titleFr":"Contrôle de caméra","titleEn":"Camera control","groupFr":"Composition & cadrage avancé","groupEn":"Advanced composition & framing","descFr":"Quand l'image devient plus complexe : foule, panneaux, caméra et sujets multiples.","descEn":"For more complex images: crowds, panels, camera logic and multiple subjects.","markdown":"---\ntitle: \"Camera Control — Mythes et réalités Midjourney\"\ncategorie: COMP\nsous-theme: Cadrages\ntype-doc: Synthèse\nversion-mj: Général\n---\n\n# Midjourney et le Contrôle de Caméra : Mythes et Réalités\n\n> Synthèse professionnelle — Source : *Midjourney Myths: Camera Control* (prompt-faqs.notion.site)  \n> Dernière mise à jour de la source : 30 mars 2026\n\n---\n\n## Vue d'ensemble\n\nL'une des idées reçues les plus répandues dans le domaine de la génération d'images par IA est de croire que les mots d'un prompt fonctionnent comme des **commandes précises**. Ce n'est pas le cas. Cette page démystifie trois catégories de termes souvent mal interprétés :\n\n- Les **métadonnées de caméra** (ex. : 85mm, f/1.4, ISO 100)\n- Le **jargon d'éclairage** (ex. : rim light, Rembrandt lighting)\n- Les **directions de caméra** (ex. : close-up, establishing shot, dutch angle)\n\n---\n\n## Fonctionnement réel des modèles de diffusion\n\nLes modèles de diffusion comme Midjourney ne fonctionnent **pas** comme des caméras, des plateaux de tournage ou des moteurs de rendu 3D. Leur logique interne est fondamentalement différente :\n\n- Le modèle part d'un **bruit aléatoire** et le transforme progressivement en image.\n- À chaque étape, il effectue des **prédictions statistiques** basées sur des patterns appris lors de l'entraînement.\n- Un prompt n'est pas une liste d'instructions : c'est un ensemble d'**influences probabilistes**.\n- Le modèle répond à la question : *\"Quelles images étaient associées à ces mots dans mes données d'entraînement ?\"*\n\n---\n\n## Mythe n°1 : Les métadonnées de caméra comme couche de contrôle\n\n### Ce que l'on croit\nÉcrire `85mm lens, f/1.4, ISO 100, shallow depth of field` fournirait un contrôle précis sur le rendu optique de l'image.\n\n### La réalité\n- Ces termes **ne sont pas connectés à une caméra virtuelle**.\n- Le modèle ne simule pas l'optique, ne calcule pas l'exposition réelle et n'ajuste pas une sensibilité de capteur.\n- Au mieux, il a appris que `85mm` ou `f/1.4` apparaissaient souvent près d'images avec certaines caractéristiques visuelles (portraits serrés, arrière-plans flous).\n- Une **vraie couche de contrôle** contraindrait directement la structure ou la composition (ex. : carte de profondeur, pose figée). La fonctionnalité expérimentale *retexture* de Midjourney s'en approche, mais les métadonnées textuelles restent de simples suggestions stylistiques.\n\n---\n\n## Mythe n°2 : Le jargon d'éclairage comme contrôle fiable\n\n### Ce que l'on croit\nDes termes comme `rim light`, `soft key` ou `volumetric light` permettraient de configurer l'éclairage d'une scène de façon prévisible.\n\n### La réalité\n- Le modèle ne construit pas une scène physique qu'il éclaire ensuite avec une source lumineuse simulée.\n- Il **prédit une image** ressemblant à ce que ces termes évoquaient dans les données d'entraînement.\n- Résultat : `dramatic rim lighting` peut parfois produire un halo, parfois un vague bord lumineux, parfois rien d'utile.\n- L'influence est **chaotique et probabiliste**, non mécanique.\n\n---\n\n## Mythe n°3 : Les directions de caméra comme tokens spéciaux\n\n### Ce que l'on croit\nDes termes cinématographiques comme `establishing shot`, `over-the-shoulder` ou `dutch angle` seraient des commandes reconnues par Midjourney.\n\n### La réalité\n- Midjourney n'est **pas spécifiquement entraîné** sur ces expressions.\n- Seuls les termes très iconiques (ex. : `close-up`, `aerial view`, `drone footage`) ont des corrélations suffisamment fortes pour influencer le résultat.\n- Même ces termes **ne contrôlent pas une caméra virtuelle** : ils prédisent des images associées à ces concepts.\n- Le résultat reste toujours basé sur des **associations apprises**, jamais sur un positionnement réel de caméra.\n\n---\n\n## Pourquoi ces termes semblent parfois fonctionner\n\n- Ces termes ne sont **pas inutiles** : ils sont simplement mal compris.\n- Ils influencent le résultat car ils sont liés à des **patterns visuels récurrents** dans les données d'entraînement.\n- La distinction fondamentale : leur influence est **probabiliste, non déterministe**.\n- Un prompt peut biaiser le modèle vers un résultat sans le contrôler avec précision.\n- Le modèle **équilibre simultanément** de nombreuses associations apprises — certaines fortes, d'autres faibles ou contradictoires.\n\n---\n\n## Modèle mental recommandé\n\nPlutôt que de concevoir les prompts comme des **commandes**, il faut les envisager comme des **suggestions pondérées** :\n\n- Les suggestions **fortes** sont celles pour lesquelles le modèle a vu des associations visuelles très cohérentes.\n- Les suggestions **faibles** sont celles dont les termes sont larges, ambigus, rares ou surchargés d'exemples contradictoires.\n- Les métadonnées, jargon d'éclairage et directions de caméra iconiques peuvent fonctionner comme des **raccourcis visuels**, jamais comme des outils de précision.\n\n---\n\n## Recommandations pratiques\n\n### Favoriser des prompts riches en termes visuels concrets\n\n- **Prépositions visuelles** : above, below, beside, against, within, beneath, across, behind…\n- **Adjectifs descriptifs** : crowded, green, empty, textured, intricate, serene, atmospheric, weathered, glossy…\n- **Adverbes descriptifs** : vividly, sharply, dimly, brightly, subtly, boldly, hazily, dramatically…\n- **Noms concrets** : mountain, river, skyscraper, bridge, forest, child, cat…\n- **Références culturelles et artistiques** : artistes, mouvements artistiques, styles photographiques, périodes historiques, genres architecturaux…\n\n### Éviter les termes à faible contribution\n\n- Superlatifs creux : `extra`, `ultra`, `super`, `hyper`, `insanely`, `extremely`\n- Connecteurs formels : `moreover`, `henceforth`, `furthermore`, `nevertheless`\n- Termes de résolution technique : `4k`, `8k`, `ultra 4k`, `octane`, `unreal`, `hd`, `hdr`\n\n---\n\n## Conclusion\n\nLa vérité technique au cœur de ces mythes est simple : **les modèles de diffusion répondent mieux à ce qui correspond clairement à des patterns qu'ils peuvent rendre visuellement**, plutôt qu'à un vocabulaire qui sonne professionnel ou technique. Le jargon de caméra, d'optique et d'éclairage peut parfois influencer le résultat, mais de façon chaotique et non garantie. Pour des résultats cohérents, la clé est de **nommer des intentions visuelles concrètes** plutôt que de chercher à imiter le langage d'un logiciel de rendu ou d'un plateau de tournage. Comprendre cette distinction transforme fondamentalement la manière d'aborder la rédaction de prompts pour l'IA générative.\n\n---\n\n*Document généré le 08/04/2026 — Basé sur le contenu de [prompt-faqs.notion.site](https://prompt-faqs.notion.site/Midjourney-Myths-Camera-Control-333024c0a17e80639260d8299258ee17)*\n"},"EFFET_couleurs-combos.md":{"file":"EFFET_couleurs-combos.md","titleFr":"Combos de couleurs","titleEn":"Color combinations","groupFr":"Effets visuels & couleurs","groupEn":"Visual effects & color","descFr":"Couleurs, fumée, énergie, double exposition et vocabulaire d'échelle.","descEn":"Color, smoke, energy, double exposure and vocabulary for scale.","markdown":"---\ntitle: \"Combos de couleurs\"\ncategorie: EFFET\nsous-theme: Couleurs\ntype-doc: Fiche\nversion-mj: Général\n---\n\n## Combos corps / costume / chapeau\n- corps rose + costume gris + chapeau noir\n- corps doré + costume blanc cassé + chapeau bordeaux\n- corps orangé + costume vert foncé + chapeau brun\n- corps bleu pâle + costume beige clair + chapeau bleu marine\n- corps noir + costume ivoire + chapeau violet foncé\n- corps rouge foncé + costume noir brillant + chapeau gris clair\n- corps brun-roux + costume gris ardoise + chapeau vert olive\n- corps vert clair + costume brun chocolat + chapeau sable\n- corps blanc perle + costume anthracite + chapeau rouge profond\n- corps gris argent + costume indigo + chapeau bleu glacier\n- corps turquoise + costume gris clair + chapeau crème\n- corps os pâle + costume bleu pétrole + chapeau noir\n- corps cuivre rosé + costume prune + chapeau gris foncé\n- corps ivoire + costume vert mousse + chapeau rouille\n- corps bleu nuit + costume doré + chapeau bordeaux mat\n"},"EFFET_effets-speciaux.md":{"file":"EFFET_effets-speciaux.md","titleFr":"Effets spéciaux, particules et énergie","titleEn":"Special effects, particles and energy","groupFr":"Effets visuels & couleurs","groupEn":"Visual effects & color","descFr":"Couleurs, fumée, énergie, double exposition et vocabulaire d'échelle.","descEn":"Color, smoke, energy, double exposure and vocabulary for scale.","markdown":"---\ntitle: \"Liste – Effets spéciaux\"\ncategorie: EFFET\nsous-theme: Effets spéciaux\ntype-doc: Liste\nversion-mj: Général\n---\n\n## 30 effets spéciaux pour Midjourney\n\n**1. Flou** — `blur, blurry, soft focus, motion blur, depth of field, bokeh`\nVariantes : motion blur (mouvement), depth of field (sujet net/fond flou), bokeh (lumières circulaires)\n\n**2. Grain** — `grain, grainy, film grain, noise, texture, vintage, grunge, gritty`\n\n**3. Distorsion** — `distortion, warped, surreal, abstract, psychedelic, glitch, liquid, melting`\n\n**4. Lumière** — `light, illumination, highlights, shadows, chiaroscuro, dramatic lighting, neon, glowing`\n\n**5. Ombre** — `shadow, silhouette, dark, mysterious, depth, contrast, chiaroscuro`\n\n**6. Holographique** — `holographic effect, iridescent colors, light reflections, 3D`\n\n**7. Feu** — `fire effect, flames, sparks, smoke, warm colors, burning`\n\n**8. Eau** — `water effect, waves, reflections, splashes, blue green colors, liquid`\n\n**9. Glace** — `ice effect, crystals, reflections, transparency, cold colors, frozen`\n\n**10. Métal** — `metal effect, shiny reflections, metallic colors, chrome, gold, silver`\n\n**11. Dispersion** — `dispersion effect, particles, scattering, fragmentation, ethereal`\n\n**12. Fumée** — `smoke effect, wisps, swirls, gray tones, vaporous, mysterious`\n\n**13. Lumière volumétrique** — `volumetric light, light rays, god rays, dust, fog, atmospheric depth`\n\n**14. Profondeur de champ inversée** — `inverted depth of field, sharp background, blurred foreground`\n\n**15. Surimpression** — `double exposure, multiple images, transparency, layering, collage`\n\n**16. Solarisation** — `solarization, inverted tones, dramatic, high contrast`\n\n**17. Pixellisation** — `pixelation, mosaic, visible pixels, retro, low resolution`\n\n**18. Tramage** — `halftone, dot pattern, vintage, comic book, graphic`\n\n**19. Diffraction** — `diffraction, light bending, colored halos, luminous patterns`\n\n**20. Ghosting** — `ghosting, superimposed images, transparent, motion, memory`\n\n**21. Rayons X** — `x-ray effect, radiography, internal structure, bones, medical`\n\n**22. Fractale** — `fractal, intricate patterns, repeating motifs, geometric, psychedelic`\n\n**23. Kaléidoscope** — `kaleidoscope, symmetrical patterns, colorful, geometric, hypnotic`\n\n**24. Mandala** — `mandala, circular patterns, spiritual, meditative, symbolic`\n\n**25. Nébuleuse** — `nebula, gas clouds, dust, colorful, cosmic, space`\n\n**26. Plasma** — `plasma, luminous filaments, energetic, futuristic`\n\n**27. Trou noir** — `black hole, space-time distortion, light absorption, mysterious`\n\n**28. Vortex** — `vortex, spirals, swirling motion, dynamic, hypnotic, energy`\n\n**29. Zénith** — `zenith, intense sunlight, blue white sky, luminous, inspiring`\n\n**30. Effet de profondeur atmosphérique** — `atmospheric depth, haze, distance, fading details`\n"},"EFFET_fumee.md":{"file":"EFFET_fumee.md","titleFr":"Fumée, brume et vapeur","titleEn":"Smoke, haze and vapor","groupFr":"Effets visuels & couleurs","groupEn":"Visual effects & color","descFr":"Couleurs, fumée, énergie, double exposition et vocabulaire d'échelle.","descEn":"Color, smoke, energy, double exposure and vocabulary for scale.","markdown":"---\ntitle: \"Fumée autour des personnages\"\ncategorie: EFFET\nsous-theme: Atmosphères\ntype-doc: Fiche\nversion-mj: Général\n---\n\n## Type de fumée (forme, densité)\n- `swirling smoke` — fumée tourbillonnante\n- `drifting haze` — brouillard dérivant\n- `rising mist` — brume montante\n- `thick vapor` — vapeur épaisse\n- `curling smoke` — fumée ondulante\n- `spiraling fog` — brouillard en spirale\n- `creeping smoke` — fumée rampante\n- `dense fumes` — émanations denses\n- `trailing wisps` — volutes traînantes\n\n## Comportement / position autour du corps\n- `smoke coils around the figure` — la fumée serpente autour du personnage\n- `mist clings to their silhouette` — la brume adhère à leur silhouette\n- `vapor drifts past their shoulders` — la vapeur passe devant leurs épaules\n- `haze envelops the lower body` — le brouillard enveloppe le bas du corps\n- `smoke trails behind them` — la fumée les suit en traînée\n- `fog obscures their feet` — le brouillard masque leurs pieds\n- `thin smoke wraps around the hands` — fumée fine autour des mains\n-
