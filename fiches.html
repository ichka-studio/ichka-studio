 `smoke pulses outward from the chest` — la fumée pulse depuis la poitrine\n\n## Apparence visuelle\n- `faint and translucent` — légère et translucide\n- `dark and heavy` — sombre et épaisse\n- `glowing edges` — bords lumineux\n- `iridescent mist` — brume irisée\n- `flickering particles inside the smoke` — particules vacillantes\n- `golden dust suspended in vapor` — poussière dorée en suspension\n- `silky smoke texture` — texture de fumée soyeuse\n- `luminescent wisps` — volutes luminescentes\n\n## Fumée magique / surnaturelle\n- `enchanted mist swirls with runes` — brume enchantée avec des runes\n- `ethereal smoke trails from their fingers` — fumée éthérée des doigts\n- `arcane vapor flickers with inner light` — vapeur arcanique lumineuse\n- `glowing glyphs swirl in the haze` — glyphes lumineux dans le brouillard\n- `smoke shaped like ancient symbols` — fumée en forme de symboles anciens\n\n## Fumée toxique / dangereuse\n- `acidic vapor clings to the air` — vapeur acide stagnante\n- `green smoke hisses from their skin` — fumée verte sifflante de la peau\n- `black fumes pour from the mouth` — fumées noires de la bouche\n- `corrosive fog trailing from wounds` — brouillard corrosif des plaies\n\n## Fumée technologique / synthétique\n- `synthetic vapor vents from their armor` — vapeur de l'armure\n- `steam hissing from mechanical joints` — vapeur des articulations\n- `neon-lit vapor bursts from a circuit` — vapeur néon d'un circuit\n- `digital mist pulses with pixel static` — brume numérique pixelisée\n"},"EFFET_double-exposure.md":{"file":"EFFET_double-exposure.md","titleFr":"Double exposition","titleEn":"Double exposure","groupFr":"Effets visuels & couleurs","groupEn":"Visual effects & color","descFr":"Couleurs, fumée, énergie, double exposition et vocabulaire d'échelle.","descEn":"Color, smoke, energy, double exposure and vocabulary for scale.","markdown":"---\ntitle: \"Super Fiche – Double Exposure (fondu / superposition)\"\ncategorie: EFFET\nsous-theme: Effets spéciaux\ntype-doc: Super Fiche\nversion-mj: Général\n---\n\n## Structure de base du prompt\n`A double exposure portrait of [SUJET PRINCIPAL], blended with [ÉLÉMENTS INTÉRIEURS], [STYLE/AMBIANCE].`\n\n---\n\n## Sujets principaux (silhouettes)\n- Portrait de femme / homme de profil\n- Silhouette entière (danseur, guerrier, enfant)\n- Silhouette animale (loup, lion, oiseau, cheval, cerf)\n- Silhouette d'arbres ou de statues\n\n## Éléments naturels à fondre\n- Forêts, arbres, branches, feuilles d'automne\n- Montagnes, falaises, déserts, océans, vagues\n- Neige, glace, paysages arctiques\n- Ciel étoilé, galaxies, nébuleuses, voie lactée\n- Feu, flammes, fumée, nuages\n- Pluie, orages, éclairs\n\n## Animaux / Vie sauvage\n- Volées d'oiseaux\n- Loups hurlant à la lune\n- Papillons, méduses pour effet aquatique\n\n## Éléments cosmiques et surréalistes\n- Planètes et lunes\n- Spirales de galaxies\n- Nébuleuses, éclats d'étoiles, poussière cosmique\n\n## Textures et matières\n- Bois, écorce, racines\n- Métal, rouille, engrenages\n- Verre brisé, glace craquelée\n- Fumée abstraite, peinture liquide, encre éclatée\n\n## Styles à ajouter\n`cinematic lighting` · `fine art photography` · `surreal fantasy` · `ethereal atmosphere` · `high contrast` · `dreamy tones`\n\n---\n\n## Exemples prêts à adapter\n`A double exposure portrait of a young woman in profile, blended with autumn forest and falling leaves, cinematic lighting.`\n`A double exposure portrait of a man, blended with galaxies, stars and nebulae, surreal fantasy style.`\n`A double exposure silhouette of a wolf, blended with a snowy mountain landscape and pine forest, fine art photography.`\n`A double exposure portrait of a ballerina, blended with flowing water and splashes, ethereal atmosphere.`\n`A double exposure portrait of a queen, blended with branches of a frozen tree and a winter sunset, cinematic fantasy style.`\n"},"VOCAB_adjectifs-grandeur.md":{"file":"VOCAB_adjectifs-grandeur.md","titleFr":"Adjectifs de grandeur et d'échelle","titleEn":"Scale and grandeur adjectives","groupFr":"Effets visuels & couleurs","groupEn":"Visual effects & color","descFr":"Couleurs, fumée, énergie, double exposition et vocabulaire d'échelle.","descEn":"Color, smoke, energy, double exposure and vocabulary for scale.","markdown":"---\ntitle: \"Adjectifs et structures pour exprimer la grandeur\"\ncategorie: VOCAB\nsous-theme: Vocabulaire\ntype-doc: Fiche\nversion-mj: Général\n---\n\n## Pour un paysage ou décor\n- `vast` — vaste, immense, étendu → paysages, steppes, plaines\n  - `vast alien desert` → vaste désert extraterrestre\n- `towering` — gigantesque, qui domine → falaises, arbres, structures verticales\n  - `towering ice cliffs` → falaises de glace gigantesques\n- `colossal` — colossal → formations naturelles ou mégastructures\n  - `colossal canyon walls` → parois de canyon colossales\n- `monolithic` — monolithique, massif → objets ou structures uniques et énormes\n  - `monolithic stone arch` → arche de pierre monolithique\n- `sprawling` — tentaculaire, qui s'étend largement → jungles, cités, ruines\n  - `sprawling alien jungle` → jungle extraterrestre tentaculaire\n- `immense` — immense → synonyme classique, bien interprété\n  - `immense glacial plain` → plaine glaciale immense\n- `endless` — sans fin, infini → plans larges et paysages répétitifs\n  - `endless sand dunes` → dunes de sable sans fin\n\n## Pour un objet, une machine ou une structure\n- `gigantic` — gigantesque, simple et direct\n  - `gigantic reactor core` → cœur de réacteur gigantesque\n- `mega-` — préfixe visuel fort\n  - `mega-structure orbiting the sun` → méga-structure en orbite\n- `overgrown` — envahi par la nature ou le temps\n  - `overgrown satellite dish` → antenne satellite envahie\n- `massive` — massif, très fiable pour gros volume\n  - `massive warship interior` → intérieur de vaisseau de guerre massif\n- `hulking` — énorme, trapu, lourd → objets ou véhicules puissants\n  - `hulking transport rover` → rover de transport massif\n\n## Pour un personnage, une créature\n- `towering` — immense, qui surplombe → colosses, figures humanoïdes\n  - `towering alien warrior` → guerrier alien immense\n- `gargantuan` — gargantuesque → registre mythique, presque cartoon\n  - `gargantuan insect queen` → reine insecte gargantuesque\n- `titanic` — titanesque → ambiance épique ou antique\n  - `titanic stone sentinel` → sentinelle de pierre titanesque\n- `hulking` — massif, puissant, lent\n  - `hulking biomechanical beast` → bête biomécanique massive\n- `colossal humanoid` — forme composée très bien comprise par MJ\n  - `colossal humanoid in armor` → humanoïde colossal en armure\n- `giant alien figure` — classique et efficace\n  - `giant alien figure crossing a plain` → figure alien géante traversant une plaine\n"},"STYLE_art-numerique.md":{"file":"STYLE_art-numerique.md","titleFr":"Art numérique","titleEn":"Digital art","groupFr":"Style artistique","groupEn":"Art direction styles","descFr":"Des directions visuelles pour choisir une matière, une époque, un rendu ou un genre.","descEn":"Visual directions for choosing a medium, period, finish or genre.","markdown":"---\ntitle: \"Art numérique COMPLET (fusionné)\"\ncategorie: STYLE\nsous-theme: Styles artistiques\ntype-doc: Super Fiche\nversion-mj: Général\n---\n\n## 1. Pixel Art\nImages créées à partir de pixels individuels, esthétique rétro des jeux vidéo et de l'art numérique low-res.\nMots-clés : pixel art, 8-bit, 16-bit, retro, video game, sprite, mosaic, low resolution, geometric, colorful.\nPrompt : `/imagine pixel art portrait of a character, 8-bit, retro style, colorful, geometric --ar 1:1`\n\n## 2. Low Poly\nImages 3D créées avec un nombre limité de polygones, aspect minimaliste et anguleux.\nMots-clés : low poly, 3D, geometric, minimalist, polygonal, faceted, abstract, modern, clean, sharp.\nPrompt : `/imagine low poly landscape, 3D, geometric, minimalist style, mountains, trees, sky --ar 16:9`\n\n## 3. Cyberpunk\nEsthétique futuriste et dystopique, mélange de technologie avancée et de désespoir, héritage *Blade Runner*.\nMots-clés : cyberpunk, futuristic, dystopian, neon, cyberpunk city, rain, dark, technology, sci-fi, android, cyborg.\nPrompt : `/imagine cyberpunk city at night, neon lights, rain, dark atmosphere, futuristic architecture, sci-fi --ar 16:9`\n\n## 4. Fantasy\nMondes imaginaires, créatures mythiques, magie — héritage *Le Seigneur des Anneaux*, *Harry Potter*.\nMots-clés : fantasy, magical, mythical, creatures, dragons, elves, wizards, castles, enchanted forest, epic.\nPrompt : `/imagine fantasy landscape, magical, enchanted forest, ancient trees, mythical creatures, epic scale --ar 16:9`\n\n## 5. Science-fiction\nExploration spatiale, technologies futuristes, extraterrestres — héritage *Star Wars*, *2001 l'Odyssée de l'espace*.\nMots-clés : sci-fi, science fiction, space, futuristic, aliens, spaceships, robots, technology, galaxies, planets.\nPrompt : `/imagine sci-fi spaceship flying through space, futuristic technology, distant galaxies, alien planet --ar 16:9`\n\n## 6. Fractal Art\nCréation d'images complexes à partir d'équations mathématiques, motifs répétitifs et formes géométriques.\nArtistes clés : Benoit Mandelbrot, Kerry Mitchell, Silvia Cordedda.\nPrompt : `/imagine Fractal art, intricate patterns, geometric shapes, vibrant colors, Mandelbrot set style --ar 1:1`\n\n## 7. Voxel Art\nImages 3D construites à partir de cubes (voxels), aspect rétro et pixelisé, utilisé dans les jeux vidéo.\nArtistes clés : @ephtracy, Markus Persson (Minecraft).\nPrompt : `/imagine Voxel art landscape, isometric view, colorful cubes, retro video game style --ar 16:9`\n\n## 8. Glitch Art\nUtilisation de bugs, d'erreurs, de distorsions numériques pour créer des images abstraites et chaotiques.\nArtistes clés : Rosa Menkman, Phillip Stearns.\nPrompt : `/imagine Glitch art portrait, distorted image, digital errors, abstract shapes, vibrant colors --ar 3:2`\n\n## 9. Generative Art\nCréation d'images à l'aide d'algorithmes et de code, résultats inattendus et surprenants.\nArtistes clés : Vera Molnár, Harold Cohen, Tyler Hobbs, Matt DesLauriers.\nPrompt : `/imagine Generative art, abstract patterns, flowing lines, vibrant colors, algorithm-based creation --ar 1:1`\n\n## 10. Motion Graphics\nAnimations graphiques pour vidéos et publicités — typographie, images, effets visuels et sonores.\nArtistes clés : Studios Buck, Elastic, Beeple.\nPrompt : `/imagine Motion graphics animation, abstract shapes, dynamic movement, vibrant colors, futuristic style --ar 16:9`\n\n## Conseils\n- **Combiner les styles** pour des images uniques et originales (ex. *cyberpunk + low poly*).\n- **Être précis** : adjectifs concrets + artiste de référence + paramètres (`--ar`, `--zoom`, `--style raw`).\n- **Référencer une œuvre existante** quand on a une image en tête — Midjourney accroche bien sur les références iconiques.\n"},"STYLE_bande-dessinee.md":{"file":"STYLE_bande-dessinee.md","titleFr":"Bande dessinée, comics et manga","titleEn":"Comics, manga and graphic novels","groupFr":"Style artistique","groupEn":"Art direction styles","descFr":"Des directions visuelles pour choisir une matière, une époque, un rendu ou un genre.","descEn":"Visual directions for choosing a medium, period, finish or genre.","markdown":"---\ntitle: \"Styles artistiques – Bande dessinée\"\ncategorie: STYLE\nsous-theme: Styles artistiques\ntype-doc: Fiche\nversion-mj: Général\n---\n\n## 1. Style ligne claire\nTraits nets et précis, couleurs vives et uniformes, absence d'ombres et de dégradés.\nMots-clés : `ligne claire, clear line, Hergé, Tintin, clean lines, flat colors, classic comic style, European comic`\nPrompt : `/imagine ligne claire illustration of a detective solving a mystery, clean lines, flat colors, Hergé style --ar 3:2`\n\n## 2. Style comics\nCouleurs vives et saturées, traits dynamiques et expressifs, onomatopées, super-héros.\nMots-clés : `comics, comic book, superhero, Marvel, DC, dynamic lines, vibrant colors, action-packed`\nPrompt : `/imagine comics illustration of a superhero flying through the city, dynamic lines, vibrant colors, action-packed --ar 9:16`\n\n## 3. Style manga\nYeux grands et expressifs, traits fins et dynamiques, souvent en noir et blanc.\nMots-clés : `manga, anime, Japanese comic, large eyes, expressive, dynamic lines, black and white, shonen, shojo`\nPrompt : `/imagine manga illustration of a girl with large eyes, expressive, dynamic lines, black and white, shojo style --ar 1:1`\n\n## Conseils\n- Combiner les styles : \"Ligne claire manga\" pour un résultat hybride.\n- Référencer un artiste précis : \"Comics in the style of Jack Kirby\".\n- Paramètres : `--ar`, `--zoom`, `--style raw`.\n"},"STYLE_peinture.md":{"file":"STYLE_peinture.md","titleFr":"Peinture","titleEn":"Painting styles","groupFr":"Style artistique","groupEn":"Art direction styles","descFr":"Des directions visuelles pour choisir une matière, une époque, un rendu ou un genre.","descEn":"Visual directions for choosing a medium, period, finish or genre.","markdown":"---\ntitle: \"Styles artistiques – Peinture\"\ncategorie: STYLE\nsous-theme: Styles artistiques\ntype-doc: Fiche\nversion-mj: Général\n---\n\n## 7. Fauvisme\nCouleurs vives et arbitraires, simplification des formes, influence de l'art africain et japonais.\nArtistes clés : Henri Matisse, André Derain, Maurice de Vlaminck.\nPrompt : `/imagine Fauvist painting of a landscape, vibrant colors, simplified forms, Matisse style --ar 16:9`\n\n## 8. Expressionnisme\nExagération des émotions, couleurs intenses et dissonantes, formes déformées.\nArtistes clés : Edvard Munch, Ernst Ludwig Kirchner, Emil Nolde.\nPrompt : `/imagine Expressionist painting of a screaming figure, distorted forms, intense colors, Munch style --ar 1:1`\n\n## 9. Cubisme\nDécomposition des objets en formes géométriques, multiples points de vue.\nArtistes clés : Pablo Picasso, Georges Braque, Juan Gris.\nPrompt : `/imagine Cubist painting of a portrait, geometric shapes, multiple perspectives, Picasso style --ar 3:2`\n\n## 10. Art déco\nFormes géométriques, motifs stylisés, matériaux luxueux, couleurs riches et contrastées.\nArtistes clés : Tamara de Lempicka, Erté, Cassandre.\nPrompt : `/imagine Art Deco illustration of a woman, geometric patterns, luxurious style, vibrant colors --ar 9:16`\n\n## 11. Pointillisme\nPetits points de couleur juxtaposés créant des effets optiques.\nArtistes clés : Georges Seurat, Paul Signac, Camille Pissarro.\nPrompt : `/imagine Pointillist painting of a landscape, small dots of color, optical mixing, Seurat style --ar 16:9`\n\n## 12. Romantisme\nExaltation des sentiments, de la passion, de la nature, du sublime.\nArtistes clés : Eugène Delacroix, Théodore Géricault, Caspar David Friedrich.\nPrompt : `/imagine Romantic painting of a shipwreck, dramatic scene, stormy sea, Delacroix style --ar 3:2`\n\n## Conseils\n- Combiner les styles pour des images uniques.\n- Être précis : adjectifs + détails + nom d'artiste.\n- Paramètres : `--ar`, `--zoom`, `--style raw`.\n"},"STYLE_artisanaux.md":{"file":"STYLE_artisanaux.md","titleFr":"Styles artisanaux","titleEn":"Handcrafted styles","groupFr":"Style artistique","groupEn":"Art direction styles","descFr":"Des directions visuelles pour choisir une matière, une époque, un rendu ou un genre.","descEn":"Visual directions for choosing a medium, period, finish or genre.","markdown":"---\ntitle: \"Fiche – Styles artisanaux MJ v7\"\ncategorie: STYLE\nsous-theme: Styles artistiques\ntype-doc: Fiche\nversion-mj: v7\n---\n\n## 1. Claymation / Stop-motion\nFigurines en pâte à modeler ou argile, visages ronds, textures sculptées à la main.\nRéférences : Wallace & Gromit, Shaun le mouton, Chicken Run.\n\n## 2. Poupées & Figurines\n- Marionnettes en tissu / feutrine (felt dolls) : aspect doux, couture visible, boutons pour les yeux\n- Peluches (plush toys) : surfaces moelleuses, textures textiles\n- Poupées en bois (wooden dolls, kokeshi) : formes simples, peinture artisanale, patine mate\n\n## 3. Papier & Découpage\n- Origami : formes géométriques pliées, couleurs unies, effet minimaliste\n- Papercut / Collage : couches de papier découpées, bords nets, couleurs vives superposées\n- Shadow boxes : profondeur créée par plusieurs plans de papier découpé\n\n## 4. Jouets & Miniatures\n- LEGO / briques : rendu cubique, emboîtements visibles\n- Playmobil style : visages simples, yeux ronds noirs, proportions enfantines\n- Dioramas miniatures : petites scènes détaillées avec accessoires minuscules\n\n## 5. Peinture & Matières artisanales\n- Peinture sur céramique : surfaces brillantes, motifs colorés\n- Aquarelle artisanale : flou, transparence, pigments visibles\n- Bois sculpté : reliefs visibles, matière brute, aspect rustique\n\n## 6. Textile & Fil\n- Broderie / embroidery : fils colorés formant une image, aspect relief\n- Tricot / crochet (knitted, crocheted) : mailles visibles, look laineux\n- Patchwork : morceaux de tissu assemblés, textures multiples\n\n## 7. Objets folkloriques et jouets traditionnels\n- Matryoshkas (poupées russes) : formes arrondies, motifs peints à la main\n- Marionnettes à fils : articulations apparentes, bois peint\n- Masques artisanaux : bois, cuir, motifs tribaux ou folkloriques\n\n## Astuce d'usage\nAjouter : \"handcrafted, handmade, artisanal, textured, stop-motion style, miniature diorama, felt, claymation, origami, embroidery, knitted, wooden toy aesthetic\"\nCombiner avec `--style raw` pour éviter que MJ \"lisse\" trop le rendu.\nPréciser le matériau dominant : \"made of felt\", \"sculpted in clay\", \"carved from wood\".\n"},"STYLE_hybrides-prehistoire-sf.md":{"file":"STYLE_hybrides-prehistoire-sf.md","titleFr":"Hybrides préhistoire / science-fiction","titleEn":"Prehistoric / sci-fi hybrids","groupFr":"Style artistique","groupEn":"Art direction styles","descFr":"Des directions visuelles pour choisir une matière, une époque, un rendu ou un genre.","descEn":"Visual directions for choosing a medium, period, finish or genre.","markdown":"---\ntitle: \"Styles hybrides – Préhistoire et Science-Fiction\"\ncategorie: STYLE\nsous-theme: Styles artistiques\ntype-doc: Fiche\nversion-mj: Général\n---\n\n| Style (EN) | Style (FR) | Exemple de prompt (EN) |\n|---|---|---|\n| Stonepunk | Stonepunk (technologie en pierre et os) | A stonepunk warrior in bone-and-crystal armor, holding a plasma axe, cinematic lighting, ultra-detailed |\n| Tribal Cyberpunk | Cyberpunk tribal | A tribal cyberpunk hunter with glowing cybernetic tattoos, wearing animal hides mixed with neon implants, ultra-detailed |\n| Dino-Tech | Dino-Tech (dinosaures augmentés) | A cybernetic dinosaur with mechanical armor, neon lights, and tribal riders, cinematic sci-fi fantasy style |\n| Fossil Mecha | Mécha fossile | A colossal fossil mecha built from dinosaur bones and futuristic metal, glowing energy core, volcanic wasteland, cinematic epic |\n| Primitive Sci-Fi | Science-fiction primitive | A primitive warrior wearing animal skins and wielding a plasma spear, futuristic ruins in the background, dramatic lighting |\n| Neon Cavemen | Hommes des cavernes néon | A neon caveman with glowing tribal paint, carrying a laser spear, inside a jungle filled with holographic ruins |\n| Prehistoric Space Opera | Opéra spatial préhistorique | Cavemen and aliens in bone-and-metal spaceships, flying through cosmic jungles, cinematic sci-fi fantasy |\n| Jurassic Futurism | Futurisme jurassique | A futuristic city built among dinosaurs, glowing towers of stone and steel, tribal warriors with energy weapons |\n| Bone-Tech Armor | Armure techno-osseuse | A futuristic knight wearing armor made of giant bones with glowing circuits, plasma sword in hand, cinematic fantasy |\n| Savage Sci-Fi Fantasy | Fantasy sci-fi sauvage | Savage tribes wielding energy bows, worshipping colossal stone idols fused with machinery, dramatic cinematic style |\n"},"STYLE_realisme.md":{"file":"STYLE_realisme.md","titleFr":"Réalisme photographique","titleEn":"Photographic realism","groupFr":"Style artistique","groupEn":"Art direction styles","descFr":"Des directions visuelles pour choisir une matière, une époque, un rendu ou un genre.","descEn":"Visual directions for choosing a medium, period, finish or genre.","markdown":"---\ntitle: \"Styles techniques – Réalisme\"\ncategorie: STYLE\nsous-theme: Styles techniques\ntype-doc: Fiche\nversion-mj: Général\n---\n\n## 1. Réalisme photographique\nCaractéristiques : Vise à reproduire fidèlement la réalité, avec un souci du détail, de la netteté, de l'éclairage naturel et de la composition.\nMots-clés Midjourney : `photorealistic, realistic, photography, high-resolution, detailed, natural lighting, sharp focus, true to life, documentary, portrait, landscape, still life`\nExemple de prompt : `/imagine photorealistic portrait of a woman with natural lighting, sharp focus, detailed features, expressive eyes --ar 3:2`\n\n## 2. Hyperréalisme\nCaractéristiques : Pousse le réalisme à l'extrême, avec une précision et un niveau de détail incroyable, souvent réalisé grâce à des techniques photographiques ou numériques.\nMots-clés Midjourney : `hyperrealistic, hyperrealism, photorealism, detailed, intricate, sharp focus, realistic, lifelike, fine art, painting, drawing, sculpture`\nExemple de prompt : `/imagine hyperrealistic painting of a bowl of fruit, detailed, intricate, sharp focus, lifelike, vibrant colors --zoom 1.5`\n\n## Conseils d'usage\n**Combiner les styles :** Mélanger différents styles techniques pour créer des images uniques (ex : \"Hyperrealistic black and white photography\").\n**Mots-clés descriptifs :** Ajouter des adjectifs pour affiner le style (ex : \"Dramatic photorealistic landscape\").\n**Référencer des artistes :** Mentionner le nom d'un artiste ou d'un mouvement pour s'inspirer de son style (ex : \"Hyperrealism in the style of Chuck Close\").\n**Paramètres utiles :** Utiliser `--ar`, `--zoom`, `--style raw` pour ajuster les images.\n"},"STYLE_sensual-non-explicite.md":{"file":"STYLE_sensual-non-explicite.md","titleFr":"Sensuel non explicite","titleEn":"Sensual, non-explicit imagery","groupFr":"Style artistique","groupEn":"Art direction styles","descFr":"Des directions visuelles pour choisir une matière, une époque, un rendu ou un genre.","descEn":"Visual directions for choosing a medium, period, finish or genre.","markdown":"---\ntitle: \"Sensual / Sexy (non explicite)\"\ncategorie: STYLE\nsous-theme: Personnages & ambiance\ntype-doc: Super Fiche\nversion-mj: Général\n---\n\n## Vue d'ensemble\n\nFiche dédiée à la création de personnages **sensuels / sexy mais non explicites** sur Midjourney. L'objectif est d'obtenir une **tension élégante** par la lumière, la posture et la suggestion, sans tomber dans le vocabulaire anatomique direct (qui fait bloquer le moteur ou produit du n'importe quoi).\n\n---\n\n## Règle d'or\n\n**Sexy = lumière + posture + suggestion.**\nJamais : description anatomique sexuelle.\n\n---\n\n## Prompt de référence (template universel)\n\n```\nelegant sensual character portrait, confident adult woman, poised stance, subtle body tension, soft parted lips, relaxed gaze, slightly lowered eyelids, smooth skin with natural texture, delicate highlights on collarbones and shoulders, form-fitting clothing or draped fabric revealing silhouette without explicit exposure, refined posture emphasizing curves and balance, controlled expression between confidence and allure\n\nlighting: soft directional key light shaping the body, warm highlights on skin, gentle shadow gradients, subtle rim light outlining silhouette\n\nmaterials: satin fabric, silk drapery, soft leather, metallic jewelry accents, skin with natural sheen\n\ncolor palette: warm skin tones, deep reds, muted golds, soft shadows, controlled contrast\n\ncomposition: medium shot or full body, three-quarter view, centered subject, clean silhouette, minimal distractions\n\nenvironment: minimal interior, soft background blur, neutral or warm tones, subtle atmospheric haze\n\nstyle: cinematic photography, fashion editorial, high-end magazine aesthetic, controlled depth of field\n```\n\n---\n\n## Master template (version condensée, prête à coller)\n\n```\nconfident adult woman, poised sensual stance, subtle body tension, arched back, relaxed shoulders, weight shifted to one leg, soft parted lips, half-lidded eyes, direct gaze, smooth skin with natural texture, visible collarbones and spine line, form-fitting or partially draped clothing revealing silhouette, fabric slipping naturally along the body, controlled elegant posture\n\nlighting: soft directional key light shaping body contours, warm highlights on skin, deep soft shadows, subtle rim light outlining silhouette\n\nmaterials: silk, satin, soft leather, metallic jewelry accents, natural skin sheen\n\ncomposition: three-quarter view, medium or full body, centered subject, clean silhouette, minimal distractions\n\nenvironment: soft blurred background, warm tones, subtle haze, minimal setting\n\nstyle: cinematic photography, high-end fashion editorial, refined aesthetic --ar 2:3 --style raw --q 2\n```\n\n---\n\n## Modules à ajouter selon le style\n\n### 🖤 Dark sensual (film noir / intense)\n`low-key lighting, deep shadows engulfing parts of the body, strong contrast, dramatic chiaroscuro, dark background, subtle smoke or haze, cold highlights mixed with warm skin tones`\n\n### 👑 Goddess / Fantasy sensual\n`flowing translucent fabrics, gold jewelry, ornate accessories, soft glowing skin, ethereal light, wind moving hair and fabric, mythological presence, elegant and powerful stance`\n\n### 🔥 Cyberpunk sensual\n`neon rim lighting, glowing reflections on skin, synthetic materials, holographic fabrics, wet surfaces, futuristic environment, electric color accents (magenta, cyan)`\n\n### 🧥 Casual / Realistic sensual\n`oversized shirt partially open, natural pose, soft daylight from window, neutral interior, minimal makeup look, relaxed posture, intimate atmosphere`\n\n### 💄 High Fashion / Vogue\n`editorial pose, exaggerated posture, sharp angles, luxury fabrics, studio lighting, clean background, bold composition, high contrast styling`\n\n### 🌙 Soft intimate\n`warm ambient light, soft shadows, close framing, gentle expression, natural pose, skin highlights subtle, calm atmosphere`\n\n---\n\n## Contrôle du niveau \"osé\"\n\nPour pousser plus loin **sans casser le moteur** :\n\n**À ajouter :**\n- `slipping fabric`\n- `exposed shoulders`\n- `visible thigh`\n- `deep neckline`\n- `back arch emphasis`\n\n**Jouer avec :**\n- la lumière sur la peau\n- la tension du tissu\n- la posture\n\n---\n\n## ❌ À ne jamais faire\n\n- vocabulaire explicite direct\n- descriptions anatomiques sexuelles\n- accumulation de mots \"sexy\" / \"hot\" / \"erotic\"\n- contradictions de ton (ex. *innocent + explicite*)\n\n➡️ Sinon Midjourney bloque la génération ou produit n'importe quoi.\n\n---\n\n## Exemple final (ultra pro)\n\n```\nconfident adult woman, arched back, weight on one leg, relaxed shoulders, soft parted lips, half-lidded gaze toward viewer, smooth skin with natural highlights on collarbones and shoulders, silk robe slipping off one shoulder revealing silhouette, deep red satin fabric, gold jewelry accents\n\nlighting: warm directional key light shaping body, soft shadows, subtle rim light outlining figure\n\nenvironment: dark minimal interior, soft haze, blurred background\n```\n"},"STYLE_selection-trois.md":{"file":"STYLE_selection-trois.md","titleFr":"Sélection rapide de trois styles","titleEn":"Fast selection of three styles","groupFr":"Style artistique","groupEn":"Art direction styles","descFr":"Des directions visuelles pour choisir une matière, une époque, un rendu ou un genre.","descEn":"Visual directions for choosing a medium, period, finish or genre.","markdown":"---\ntitle: \"Styles artistiques – Sélection trois styles\"\ncategorie: STYLE\nsous-theme: Styles artistiques\ntype-doc: Fiche\nversion-mj: Général\n---\n\n## 1. Art décoratif\nMotifs répétitifs, formes stylisées, couleurs vives.\nMots-clés : `decorative art, patterns, motifs, stylized, vibrant colors, Art Deco, Art Nouveau, folk art, textile design, wallpaper`\nPrompt : `/imagine decorative art pattern, floral motifs, stylized, vibrant colors, Art Nouveau style --ar 1:1`\n\n## 2. Art populaire (Folk Art)\nStyle naïf, représentations simples et colorées, inspiré par la culture locale.\nMots-clés : `folk art, naive art, traditional, colorful, simple, rural, cultural, handmade, crafts, Americana`\nPrompt : `/imagine folk art painting, rural scene, colorful, naive style, traditional motifs, Americana --ar 3:2`\n\n## 3. Art brut (Outsider Art)\nStyle spontané et non conventionnel, artistes autodidactes.\nMots-clés : `outsider art, art brut, naive, raw, spontaneous, non-conventional, self-taught, expressive, visionary, intuitive`\nPrompt : `/imagine outsider art painting, raw, spontaneous style, non-conventional techniques, expressive colors, visionary --ar 1:1`\n"},"STYLE_techniques-liste.md":{"file":"STYLE_techniques-liste.md","titleFr":"Liste de styles techniques","titleEn":"Technical style list","groupFr":"Style artistique","groupEn":"Art direction styles","descFr":"Des directions visuelles pour choisir une matière, une époque, un rendu ou un genre.","descEn":"Visual directions for choosing a medium, period, finish or genre.","markdown":"---\ntitle: \"Liste – Styles techniques\"\ncategorie: STYLE\nsous-theme: Styles techniques\ntype-doc: Liste\nversion-mj: Général\n---\n\n## Styles techniques\n\n### Réalisme photographique\nCaractéristiques: Vise à reproduire fidèlement la réalité, avec un souci du détail, de la netteté, de l'éclairage naturel et de la composition.\nMots-clés: `photorealistic, realistic, photography, high-resolution, detailed, natural lighting, sharp focus, true to life`\nExemple: `/imagine photorealistic portrait of a woman with natural lighting, sharp focus, detailed features, expressive eyes --ar 3:2`\n\n### Hyperréalisme\nCaractéristiques: Pousse le réalisme à l'extrême, avec une précision et un niveau de détail incroyable.\nMots-clés: `hyperrealistic, hyperrealism, photorealism, detailed, intricate, sharp focus, lifelike`\nExemple: `/imagine hyperrealistic painting of a bowl of fruit, detailed, intricate, sharp focus, lifelike, vibrant colors --zoom 1.5`\n\n### Cartoon\nCaractéristiques: Style humoristique avec personnages exagérés, expressions faciales expressives et couleurs vives.\nMots-clés: `cartoon, animated, comical, exaggerated, expressive, vibrant colors, caricature, Disney`\nExemple: `/imagine cartoon portrait of a cat, exaggerated features, expressive eyes, vibrant colors --ar 1:1`\n\n### Anime\nCaractéristiques: Style d'animation japonaise, grands yeux, traits fins et dynamiques.\nMots-clés: `anime, manga, Japanese animation, large eyes, expressive, dynamic lines, Studio Ghibli`\nExemple: `/imagine anime illustration of a girl with large eyes, expressive, dynamic pose, vibrant colors --ar 9:16`\n\n### Peinture à l'huile\nCaractéristiques: Couleurs riches, textures visibles, effets de lumière et d'ombre subtils.\nMots-clés: `oil painting, realistic, detailed, rich colors, visible brushstrokes, light and shadow, texture`\nExemple: `/imagine oil painting of a landscape, realistic, detailed, rich colors, visible brushstrokes --ar 16:9`\n\n### Aquarelle\nCaractéristiques: Couleurs transparentes, effets de flou et de légèreté, atmosphère douce et poétique.\nMots-clés: `watercolor, transparent colors, soft, delicate, flowing, light, airy, dreamy, poetic`\nExemple: `/imagine watercolor painting of a flower, transparent colors, soft, delicate, flowing, dreamy --ar 1:1`\n\n### Dessin au crayon\nCaractéristiques: Traits de crayon visibles, nuances de gris, atmosphère intime.\nMots-clés: `pencil drawing, graphite, sketch, lines, shading, grayscale, realistic, expressive`\nExemple: `/imagine pencil drawing of a portrait, graphite, sketch, lines, shading, grayscale, expressive eyes --ar 3:2`\n\n### Flou\nCaractéristiques: Adoucit les contours, crée une sensation de mouvement, de distance ou de mystère.\nMots-clés: `blur, blurry, soft focus, out of focus, motion blur, depth of field, bokeh`\nExemple: `/imagine portrait of a woman with soft focus, dreamy, ethereal, bokeh background --ar 3:2`\n\n### Grain\nCaractéristiques: Texture granuleuse, évoque un style vintage, rétro ou grunge.\nMots-clés: `grain, grainy, film grain, noise, texture, vintage, retro, grunge, gritty`\nExemple: `/imagine grainy black and white photo of a city street, vintage style, film noir, gritty --ar 16:9`\n\n### Distorsion\nCaractéristiques: Modifie la forme d'un objet, aspect déformé, surréaliste ou abstrait.\nMots-clés: `distortion, distorted, warped, surreal, abstract, psychedelic, glitch, liquid, melting`\nExemple: `/imagine distorted portrait, surreal, abstract, psychedelic colors, warped features --ar 1:1`\n\n### Lumière\nCaractéristiques: Utilisation de la lumière pour créer des ambiances, contrastes et effets dramatiques.\nMots-clés: `light, lighting, illumination, highlights, shadows, chiaroscuro, dramatic lighting, neon, glowing`\nExemple: `/imagine landscape with dramatic lighting, chiaroscuro, sun rays, clouds, epic scale --ar 16:9`\n\n### Ombre\nCaractéristiques: Utilisation des ombres pour donner de la profondeur, du volume et du mystère.\nMots-clés: `shadow, shadows, silhouette, dark, mysterious, depth, volume, contrast, chiaroscuro`\nExemple: `/imagine silhouette of a person against a sunset, long shadows, mysterious, contemplative --ar 3:2`\n"},"PROMPT_emphase-deemphase.md":{"file":"PROMPT_emphase-deemphase.md","titleFr":"Emphase et dé-emphase","titleEn":"Emphasis and de-emphasis","groupFr":"Méthode prompt","groupEn":"Prompt method","descFr":"Guides pratiques pour structurer, renforcer ou alléger un prompt Midjourney.","descEn":"Practical guides to structure, strengthen or simplify a Midjourney prompt.","markdown":"---\ntitle: \"Emphase et Dé-emphase dans Midjourney\"\ncategorie: PROMPT\nsous-theme: Méthode\ntype-doc: Synthèse\nversion-mj: Général\n---\n\n# Créer de l'Emphase et de la Dé-emphase dans Midjourney\n\n> Synthèse professionnelle — Source : *Create Emphasis & De-Emphasis* (prompt-faqs.notion.site)\n> Dernière mise à jour de la source : 26 mars 2026\n\n---\n\n## Vue d'ensemble\n\nL'attention du modèle est une ressource **limitée**. Lorsqu'un détail disparaît ou est mal rendu, c'est souvent parce que d'autres éléments du prompt monopolisent cette attention. Il existe plusieurs stratégies complémentaires pour orienter le modèle vers ce qui compte vraiment, tant pour renforcer un détail (emphase) que pour en effacer un autre (dé-emphase).\n\n---\n\n## Principes fondamentaux\n\n- **L'attention du modèle est scarce** : si un détail disparaît, c'est souvent parce que d'autres éléments du prompt lui font concurrence.\n- **La redondance aide** : reformuler une idée clé sous plusieurs formes augmente les chances qu'elle soit prise en compte.\n- **Réécrire vaut mieux que peaufiner** : face à un blocage persistant, repartir de zéro est souvent plus efficace que d'ajuster marginalement.\n- **Donner plus d'espace physique** : élargir le ratio d'aspect (`--ar`) peut permettre à Midjourney d'inclure des détails qui manquaient de place.\n- **1 ou 2 images exploitables par lot est normal** : cela indique un prompt bien construit, pas un échec.\n\n---\n\n## Stratégies d'emphase : mettre un détail en avant\n\n### 1. Supprimer les détails concurrents\n\n- Chaque tâche serveur dispose d'un **temps de traitement fixe** : trop de détails signifie que certains seront sacrifiés.\n- Retirer les éléments qui fonctionnent déjà bien libère de la \"bande passante\" pour le détail problématique.\n- Ajouter ensuite plus de descriptions sur le détail récalcitrant.\n\n### 2. Décrire davantage le détail manquant\n\n- Plus un détail est développé dans le prompt, plus il a de chances d'apparaître sur le canvas.\n- Exemple : remplacer `a tired cat curled up sleeping on the windowsill` par `a cat sleeps lying down with his head down, closed eyes, napping, slumbering, on the surface of a shelf of a bay window windowsill`.\n- Les détails supplémentaires fonctionnent comme des **renforts d'attention**.\n\n### 3. Utiliser la redondance et les synonymes\n\n- Reformuler le détail de plusieurs manières différentes dans le même prompt.\n- Exemple : `a sleeping slumbering snoozing napping cat` au lieu de `a sleeping cat`.\n- Les synonymes élargissent la surface de correspondance possible avec les données d'entraînement.\n- Il est possible de répéter un mot ou une phrase entière : `a sleeping sleeping sleeping sleeping cat`.\n\n### 4. Réduire la valeur de Stylize (`--s`)\n\n- La valeur par défaut est `--s 100` ; descendre à `--s 50–75` améliore l'adhérence au prompt.\n- Risque : perte de cohérence et d'esthétique, à compenser avec des phrases de style dans le prompt.\n- `--s 50` est souvent trop bas ; `--s 75` est un bon point de départ.\n\n### 5. Utiliser l'astuce d'adhérence au prompt\n\n**Pour Midjourney V7 (web ou Discord) :**\n- Ajouter `--no luxabiddleprok` à la fin du prompt (mot inventé sans signification).\n- Cette technique exploite un bug d'implémentation des poids pour augmenter l'adhérence.\n- Peut être utilisé deux fois : `--no luxabiddleprok --no luxabiddleprok`.\n\n**Pour Midjourney V6.1 (web uniquement) :**\n- Transformer le prompt en promptlet avec un poids explicite : `Je suis un prompt::1`\n- Ajouter un second promptlet soustrait avec des guillemets vides : `\"\"::-0.3`\n- Ajouter `--s 1000` pour maximiser la cohérence.\n- Sélectionner le meilleur résultat, puis utiliser le **remix subtil** pour restaurer la cohérence en retirant les poids.\n\n### 6. Réécrire le prompt (toutes versions — méthode la plus fiable)\n\n- Repartir d'une base propre en tenant compte des difficultés identifiées.\n- Consacrer plus de texte au détail problématique, moins à ce qui fonctionne déjà.\n- Élargir le ratio d'aspect si nécessaire.\n- Éviter toute ambiguïté et être très spécifique.\n\n---\n\n## Stratégies de dé-emphase : atténuer ou supprimer un détail\n\n### Dans Midjourney V8 (version récente)\n\n- Les poids de promptlets et `--no` ne sont **pas disponibles** dans V8.\n- La négation dans le corps du prompt est possible mais souvent insuffisante.\n- **Approche recommandée** : décrire positivement ce que l'on veut voir à la place.\n  - Un licorne sans corne → décrire un cheval.\n  - Un cowboy sans chapeau → décrire ses cheveux ou une tête nue.\n  - Une femme attendant son café → décrire une table vide devant elle.\n\n### Dans les versions antérieures (≤ V6) — Scénario A : emphase excessive\n\n- Problème : un élément \"inspiré de X\" ressemble exactement à X.\n- Solution : ajouter le terme problématique avec un **poids négatif faible** à la fin du prompt.\n  - Exemple : `... inspired by a salamander:: inspired by a salamander::-0.2`\n  - Augmenter jusqu'à `::-0.5` si nécessaire.\n- En V7 : utiliser `--no inspired by a salamander` (équivalent de `::-0.5`).\n\n### Dans les versions antérieures (≤ V6) — Scénario B : détail non sollicité\n\n- Problème : un détail apparaît sans avoir été demandé (ex. chapeaux sur tous les personnages).\n- Solution 1 (sujet principal) : décrire positivement ce qui doit remplacer le détail.\n  - Ex. : décrire les cheveux → les chapeaux disparaissent ; décrire un cou nu → les colliers disparaissent.\n- Solution 2 (personnages secondaires) : ajouter le détail avec un poids négatif.\n  - Exemple : `A man plays piano in an Old West saloon:: hats::-0.3`\n  - Ou : `--no hats` (équivalent de `::-0.5`).\n\n---\n\n## Récapitulatif des méthodes selon la version\n\n| Méthode | V6 | V7 | V8 |\n|---|---|---|---|\n| Suppression de détails concurrents | ✅ | ✅ | ✅ |\n| Redondance et synonymes | ✅ | ✅ | ✅ |\n| Réduction de `--s` | ✅ | ✅ | ✅ |\n| Réécriture du prompt | ✅ | ✅ | ✅ |\n| Promptlets avec poids (`::`) | ✅ | ❌ | ❌ |\n| Astuce `--no` nonsense word | ❌ | ✅ | ❌ |\n| Poids négatifs (`::-x`) | ✅ | ❌ | ❌ |\n| Négation positive (description) | ✅ | ✅ | ✅ (recommandé) |\n\n---\n\n## Conclusion\n\nLa gestion de l'emphase et de la dé-emphase dans Midjourney repose sur une compréhension fine du fonctionnement probabiliste du modèle. Aucune méthode ne fonctionne à tous les coups, mais toutes peuvent fonctionner dans certains cas. La **réécriture complète du prompt** reste la stratégie la plus fiable et universelle, toutes versions confondues. Dans les versions récentes (V8), l'approche change radicalement : la dé-emphase passe désormais par la **description positive** de ce que l'on souhaite voir plutôt que par la suppression de ce que l'on ne veut pas. Maîtriser ces techniques transforme profondément la capacité à obtenir des résultats cohérents et fidèles à sa vision créative.\n\n---\n\n*Document généré le 08/04/2026 — Basé sur le contenu de [prompt-faqs.notion.site](https://prompt-faqs.notion.site/Create-Emphasis-De-Emphasis-299024c0a17e81739df3d787c9a741e6)*\n"},"PROMPT_guide-rapide.md":{"file":"PROMPT_guide-rapide.md","titleFr":"Guide rapide des prompts efficaces","titleEn":"Quick guide to effective prompts","groupFr":"Méthode prompt","groupEn":"Prompt method","descFr":"Guides pratiques pour structurer, renforcer ou alléger un prompt Midjourney.","descEn":"Practical guides to structure, strengthen or simplify a Midjourney prompt.","markdown":"---\ntitle: \"Guide rapide – Prompts efficaces\"\ncategorie: PROMPT\nsous-theme: Méthode\ntype-doc: Guide\nversion-mj: Général\n---\n\n## 1. Structure de base d'un prompt\n**Sujet + Action + Contexte + Ambiance**\n- **Sujet (Subject)** : Le personnage/objet principal.\n- **Action (Action)** : Ce qu'il fait ou son état.\n- **Contexte (Context)** : L'environnement, l'arrière-plan.\n- **Ambiance (Mood/Atmosphere)** : Lumière, couleurs, atmosphère émotionnelle.\n\nExemple : `\"A futuristic samurai, standing on a neon-lit rooftop, overlooking a cyberpunk city, rain falling.\"`\n\n---\n\n## 2. Éviter les erreurs courantes\n\n### Évite les répétitions inutiles\n- ❌ `\"A knight in shining armor. The knight holds a sword. The knight is in a dark forest.\"`\n- ✅ `\"A knight in shining armor holds a sword in a dark forest.\"`\n\n### Précision sans surcharge\n- ❌ Trop vague : `\"A warrior in a battlefield.\"`\n- ❌ Trop complexe : `\"A warrior, battle-scarred, wearing a mix of medieval and futuristic armor, standing in a battlefield with smoke, ruins, and a giant dragon in the background while the sun sets, creating an orange glow.\"`\n- ✅ Équilibré : `\"A battle-scarred warrior in hybrid medieval-futuristic armor, standing in a smoky battlefield at sunset, a dragon looming in the distance.\"`\n\n---\n\n## 3. Concepts avancés\n\n### A. Antithèse visuelle (Visual Antithesis)\nAssocier des éléments opposés pour créer un contraste fort.\n- ❌ Banal : `\"A medieval knight in a castle.\"`\n- ✅ Intéressant : `\"A medieval knight in a futuristic city, neon lights reflecting on his armor.\"`\n\nAutres exemples :\n- `\"A robot covered in moss and vegetation.\"`\n- `\"A sorceress in a cybernetic robe, controlling digital runes.\"`\n\nAstuce : Mélange des époques, styles ou concepts inattendus.\n\n### B. Mise en scène & dynamisme\n- ❌ Statique : `\"A samurai with a sword.\"`\n- ✅ Dynamique : `\"A samurai mid-air, slashing with his katana, rain pouring around him.\"`\n- Avec storytelling : `\"A lone astronaut, helmet under his arm, staring at Earth from a desolate moon surface.\"`\n\n### C. Style et ambiance — mots-clés clés\n**Lumière :** `dramatic lighting`, `soft glow`, `neon reflections`\n**Textures :** `gritty`, `smooth`, `metallic`, `organic`\n**Couleurs :** `vibrant`, `pastel`, `monochrome`, `golden hues`\n**Émotions :** `mysterious`, `melancholic`, `epic`, `dreamlike`\n\nExemple fort : `\"A mysterious figure in a long coat, standing under a flickering neon sign, rain reflecting the lights on the wet pavement.\"`\n\n---\n\n## 4. Tester et affiner\n- Décrire précisément ce qui compte (éviter les détails inutiles).\n- Ajouter des précisions sur le cadrage (`close-up`, `wide shot`).\n- Expérimenter et ajuster en fonction des résultats.\n- Garder un fichier avec les prompts testés et leurs résultats pour affiner son style.\n\n---\n\n## Structure générale complète d'un prompt\n**Sujet → Adjectifs → Style → Médium → Composition → Éclairage → Contexte**\n\nExemple : `\"A majestic lion, highly detailed, fantasy style, oil painting, dramatic lighting, in a misty jungle\"`\n\n---\n\n## Mots-clés par catégorie\n\n### Style & Composition\n`cinematic lighting` · `ultra detailed` · `dynamic composition` · `isometric view` · `wide-angle shot` · `macro photography`\n\n### Médiums artistiques\n`oil painting` · `watercolor` · `digital painting` · `pixel art` · `ink sketch` · `charcoal drawing`\n\n### Esthétiques & Inspirations\n`cyberpunk` · `baroque` · `Art Nouveau` · `futuristic` · `surrealism` · `minimalist` · `dark fantasy`\n\n### Précision & Réalisme\n`photo-realistic` · `hyper-detailed` · `8K, UHD` · `bokeh background` · `volumetric lighting`\n\n### Technologie & Science-fiction\n`cybernetic enhancements` · `mecha armor` · `dystopian cityscape` · `android with human emotions`\n\n### Paysages & Environnements\n`mystical forest` · `post-apocalyptic ruins` · `floating islands` · `frozen wasteland` · `sunset over the ocean`\n\n### Personnages & Expressions\n`expressive face` · `heroic pose` · `ethereal beauty` · `glowing eyes` · `ancient warrior in battle`\n\n---\n\n## Astuces avancées\n\n### 1. Références culturelles ou artistiques\n`\"In the style of Van Gogh\"` · `\"In the cinematic style of Blade Runner\"`\nCombiner : `\"Cyberpunk knight, oil painting, Art Nouveau\"`\n\n### 2. Type de caméra / perspective\n`\"Close-up of a futuristic helmet\"` · `\"Wide shot of a neon city skyline\"` · `\"From a bird's eye view, looking down at a medieval battle\"`\n\n### 3. Profondeur de champ (Depth of Field)\n`\"Shallow depth of field, focusing on the character's face, background blurred\"`\n`\"Deep focus, with both foreground and background in sharp detail\"`\n\n### 4. Textures pour plus de réalisme\n`\"A leather jacket with a distressed, worn texture\"`\n`\"A metallic robot with rust and scratches\"`\n\n### 5. Temporalité / heure de la journée\n`\"A sunset over a futuristic city\"`\n`\"An ancient temple at dawn, soft morning light casting long shadows\"`\n\n### 6. Contrastes d'échelle\n`\"A giant tree with tiny glowing creatures flying around it\"`\n`\"A small child standing next to a towering, futuristic skyscraper\"`\n\n### 7. Direction et intensité de la lumière\n`\"Backlit silhouette of a warrior with the sun setting behind him\"`\n`\"Soft ambient lighting with a subtle glow from the character's eyes\"`\n\n### 8. Palette de couleurs précise\n`\"A futuristic city with shades of blue and purple, bathed in neon lights\"`\n`\"A dark, monochrome scene with cold greys and blacks\"`\n\n---\n\n## À retenir\n- Bon équilibre entre précision et fluidité.\n- Ambiance bien définie avec des mots-clés forts.\n- Contrastes visuels et mise en scène dynamique.\n- Storytelling intégré : qui est le sujet ? Pourquoi est-il là ?\n"},"PROMPT_mots-cles-debut-fin.md":{"file":"PROMPT_mots-cles-debut-fin.md","titleFr":"Mots-clés de début et fin de prompt","titleEn":"Opening and closing prompt keywords","groupFr":"Méthode prompt","groupEn":"Prompt method","descFr":"Guides pratiques pour structurer, renforcer ou alléger un prompt Midjourney.","descEn":"Practical guides to structure, strengthen or simplify a Midjourney prompt.","markdown":"---\ntitle: \"Mots-clés – Début et fin de prompt\"\ncategorie: PROMPT\nsous-theme: Méthode\ntype-doc: Tableur\nversion-mj: Général\n---\n\n## À utiliser en début ou en fin de prompt\n\n## DÉCOR / ENDROIT\n\n### Nature / Paysages\n- In a forest (dans une forêt)\n- In a dense jungle (dans une jungle dense)\n- In a snowy field (dans un champ enneigé)\n- In a mountain valley (dans une vallée)\n- In a desert (dans un désert)\n- In a grassy meadow (dans une prairie)\n- In a swamp (dans un marécage)\n- On a cliff by the sea (sur une falaise au bord de la mer)\n- On a tropical beach (sur une plage tropicale)\n- On a frozen lake (sur un lac gelé)\n- In a cave (dans une grotte)\n- In a bamboo grove (dans une bambouseraie)\n- On a dirt road through the woods (sur un chemin forestier)\n- In a sunflower field (dans un champ de tournesols)\n- Among tall pine trees (parmi de grands pins)\n- On a foggy hilltop (sur une colline brumeuse)\n\n### Urbain / Architecture\n- On a city street (dans une rue de ville)\n- In a narrow alley (dans une ruelle étroite)\n- On a rooftop at night (sur un toit la nuit)\n- In a subway station (dans une station de métro)\n- Inside a small café (dans un petit café)\n- In a busy marketplace (dans un marché animé)\n- In an abandoned building (dans un bâtiment abandonné)\n- In a luxury hotel lobby (dans un hall d'hôtel de luxe)\n- In a shopping mall (dans un centre commercial)\n- In a parking lot (dans un parking)\n- In a neon-lit street (dans une rue éclairée au néon)\n- In a crowded train car (dans un wagon bondé)\n- In an underground bunker (dans un bunker souterrain)\n- In a skyscraper lobby (dans un hall de gratte-ciel)\n- Inside a jazz bar (dans un bar de jazz)\n- In a laundromat at night (dans une laverie la nuit)\n\n### Intérieurs / Domestique\n- Inside a kitchen (dans une cuisine)\n- In a messy bedroom (dans une chambre en désordre)\n- In a grand library (dans une grande bibliothèque)\n- In an attic full of old things (dans un grenier rempli d'objets anciens)\n- In a living room with big windows (dans un salon avec de grandes fenêtres)\n- In a classroom (dans une salle de classe)\n- Inside a greenhouse (dans une serre)\n- In a cozy cabin (dans une cabane confortable)\n- In a medieval castle hall (dans une salle de château médiéval)\n- In a child's playroom (dans une salle de jeux)\n\n### Mobilité / Transport\n- In a moving train (dans un train en mouvement)\n- On a small boat (sur un petit bateau)\n- In a vintage car (dans une voiture ancienne)\n- In a hot air balloon (dans une montgolfière)\n- On a bicycle in the countryside (à vélo à la campagne)\n- On a bus full of passengers (dans un bus bondé)\n- On a motorcycle on an empty road (à moto sur une route déserte)\n- In a carriage pulled by horses (dans une calèche tirée par des chevaux)\n- On a spaceship bridge (sur le pont d'un vaisseau spatial)\n- On a train platform at sunset (sur un quai au coucher du soleil)\n\n### Fantastique / Mystique\n- On floating islands (sur des îles flottantes)\n- In a ruined temple (dans un temple en ruines)\n- In an ancient forest (dans une forêt ancienne)\n- In a glowing cave (dans une grotte lumineuse)\n- In a castle in the clouds (dans un château dans les nuages)\n- In a mysterious portal room (dans une salle à portails mystérieux)\n- On a flying ship (sur un navire volant)\n- In a city made of glass towers (dans une ville de tours en verre)\n\n### Science-fiction / Imaginaire\n- In a spaceship corridor (dans un couloir de vaisseau)\n- On an alien planet (sur une planète extraterrestre)\n- In a futuristic city (dans une ville futuriste)\n- In a cyberpunk alley (dans une ruelle cyberpunk)\n- In a virtual simulation room (dans une salle de simulation virtuelle)\n- In a robotic factory (dans une usine de robots)\n- In a deep space research lab (dans un labo spatial)\n- In a world with two suns (dans un monde à deux soleils)\n\n## ÉPOQUE / PÉRIODE\n\n### Historique\n- In the Stone Age (à l'âge de pierre)\n- In ancient Egypt (dans l'Égypte antique)\n- In ancient Greece (dans la Grèce antique)\n- In the Roman Empire (dans l'Empire romain)\n- In the Middle Ages (au Moyen Âge)\n- During the Renaissance (à la Renaissance)\n- In the 18th century (au XVIIIe siècle)\n- During the French Revolution (pendant la Révolution française)\n- In the Victorian era (à l'époque victorienne)\n- In the Wild West (dans le Far West)\n- In 1920s Paris (dans le Paris des années 1920)\n- During World War II (pendant la Seconde Guerre mondiale)\n\n### Moderne & Rétro\n- In the 1950s / 1960s / 1970s / 1980s / 1990s\n- In a retro 1980s setting\n- In a noir 1940s environment\n- In early 2000s suburban life\n- In a small 2010s apartment\n- In a modern office building\n- In a contemporary urban park\n- In a rainy 2000s city\n\n### Futuriste / Imaginaire\n- In the near future\n- In a post-apocalyptic world\n- In a cyberpunk city\n- In a dystopian future\n- In a utopian future\n- In the year 3000\n- In an alternate 21st century\n\n### Hors du temps / Fantastique\n- In a timeless void\n- In a dreamlike landscape\n- In a magical kingdom\n- During an endless twilight\n- In a parallel universe\n- In a world made of clouds\n- On the edge of time\n"},"REGLES_parametres.md":{"file":"REGLES_parametres.md","titleFr":"Paramètres Midjourney","titleEn":"Midjourney parameters","groupFr":"Règles & paramètres","groupEn":"Rules & parameters","descFr":"Les réglages à connaître pour contrôler le format, le style et les variations.","descEn":"Key settings for format, style control and variations.","markdown":"---\ntitle: \"Guide ultime – Paramètres\"\ncategorie: REGLES\nsous-theme: Paramètres\ntype-doc: Guide\nversion-mj: Général\n---\n\n## Stylisation (--stylize ou --s)\n- `--s 50` — Style artistique minimal\n- `--s 100` — Style artistique par défaut\n- `--s 250` — Style artistique prononcé\n- `--s 750` — Style artistique très intense, résultats surprenants\nPour une idée précise, ne pas dépasser 150. Pour un concept libre, explorer au-delà.\n\n## Cohérence (--chaos ou --c)\n- `--c 0` — Images très similaires (par défaut)\n- `--c 50` — Variété accrue\n- `--c 100` — Très grande variété\nAu-delà de 15, les images s'éloignent considérablement.\n\n## Zoom\n- Zoom Out 1.5x / 2x — Dézoom léger / important\n- Custom Zoom — Personnalisé (1 à 2), permet d'ajouter/modifier\n\n## Suppression d'éléments (--no)\n`--no \"sujet\"` — Supprime l'élément spécifié. Ex : `--no \"oiseaux, nuages\"`\n\n## Qualité (--quality ou --q)\n- `--q 0.25` — Minimale · `--q 0.5` — Moyenne · `--q 1` — Défaut · `--q 2` — Maximale\n\n## Formats d'image (--ar)\n- `--ar 3:2` — Photographie\n- `--ar 7:4` — Écran de téléphone\n- `--ar 4:7` — Poster\n- `--ar 16:9` — Écran d'ordinateur\n\n## Styles\n- `--style raw` — Photoréalisme\n- `--niji 6` — Style anime/BD\n- `--style cute --niji 5` — Très enfantin\n- `--style scenic --niji 5` — Environnement et éclairages travaillés\n- `--style expressive --niji 5` — Accent sur le sujet, influence occidentale\n\n## Références d'image et de style\n- `--cref [URL]` — Character Reference\n- `--cw [0-100]` — Character Weight\n- `--sref [URL]` — Style Reference\n- `--sw [0-1000]` — Style Weight\n- `--sref random` — Style aléatoire\n- `--iw [0-2]` — Image Weight (importance image vs prompt)\n\n## Autres commandes utiles\n- `--stop 50` — Arrête la génération à 50%\n- `--r [n]` — Génère n variations du même prompt\n- `/blend` — Mélange jusqu'à 5 images\n- `/describe` — Analyse une image, propose 4 prompts\n- `{A|B|C}` — Permutations\n- `mot::2` — Poids x2 sur un mot\n\n## Conseils\n- Paramètres complets (`--quality`, `--style raw`) plutôt que raccourcis\n- Mode turbo + `--sref random` pour explorer de nouveaux styles\n- Désactiver Remix + Relax Mode + jusqu'à 10 Rerolls pour affiner\n"},"EXEMPLE_boxe.md":{"file":"EXEMPLE_boxe.md","titleFr":"Exemple autour du thème boxe","titleEn":"Boxing theme example","groupFr":"Exemples & outils","groupEn":"Examples & tools","descFr":"Des cas concrets et des listes d'inspiration pour démarrer plus vite.","descEn":"Concrete cases and inspiration lists to start faster.","markdown":"---\ntitle: \"Exemples – Thème de la boxe\"\ncategorie: EXEMPLE\nsous-theme: Autre\ntype-doc: Fiche\nversion-mj: Général\n---\n\nRéférences pour prompts Midjourney sur le thème de la boxe (période 1978–1986), style affiches de combat.\n\n## Styles artistiques\n**Pop art** — Couleurs vives, images de Roy Lichtenstein, affiches sérigraphiées.\n**Art déco** — Lignes géométriques, couleurs riches, typographie élégante.\n**Affiches de films** — Inspirées des affiches de l'époque, avec slogans accrocheurs.\n\n## Éléments visuels\n- Gants de boxe usés, tachés de sang, symboles de combat.\n- Ring de boxe : lumières vives, foule en arrière-plan, ambiance électrique.\n- Visages de boxeurs : concentrés, déterminés, parfois ensanglantés.\n- Corps de boxeurs : musculatures saillantes, mouvements dynamiques.\n- Typographie : noms des boxeurs, date et lieu du combat, slogans percutants.\n\n## Palette couleurs\n- **Rouge** — Passion, violence, adrénaline.\n- **Noir** — Mystère, danger, professionnalisme.\n- **Blanc** — Pureté, innocence, contraste.\n- **Or** — Prestige, victoire, récompense.\n\n## Mots-clés utiles\n`boxing poster, fight night, 1970s, vintage, retro, gritty, dynamic, powerful`\n\n## Combinaisons testées\n- `Pop art boxing poster, red and black, close-up on boxer's face, dynamic pose, 1970s style`\n- `Vintage fight night poster, art deco style, gold and black, two boxers facing each other, dramatic lighting`\n- `Gritty boxing photography, black and white, worn gloves, empty ring, sense of anticipation`\n\n## Conseils\nArtistes de référence : Andy Warhol, Raymond Pettibon.\nFormats : `--ar 9:16` pour poster vertical, `--ar 3:2` pour affiche horizontale.\n"},"EXEMPLE_pellicules.md":{"file":"EXEMPLE_pellicules.md","titleFr":"Pellicules photo et rendu analogique","titleEn":"Film stocks and analog looks","groupFr":"Exemples & outils","groupEn":"Examples & tools","descFr":"Des cas concrets et des listes d'inspiration pour démarrer plus vite.","descEn":"Concrete cases and inspiration lists to start faster.","markdown":"---\ntitle: \"Fiche – Pellicules efficaces\"\ncategorie: EXEMPLE\nsous-theme: Styles artistiques\ntype-doc: Fiche\nversion-mj: v7\n---\n\n## Excellentes\n\n**Cinestill 800T** — Teinte nocturne cinéma, rouges halogènes, tons cyan, reflets de néon.\n`Photographed on Cinestill 800T film, neon reflections with cyan and red tones.`\n\n**Kodak Portra 800** — Chair douce, faible contraste, palette beige/rose/or, très naturel.\n`Shot on Kodak Portra 800 film, soft skin tones and natural beige-pink palette.`\n\n**Kodak Portra 400** — Même rendu que 800 avec un peu moins de grain.\n`Captured on Kodak Portra 400 film, smooth tones with subtle grain and pastel colors.`\n\n## Très bons\n\n**Kodak Ektachrome** — Saturation nette, bleus froids, éclat vintage.\n`Photographed on Kodak Ektachrome film, crisp saturation with cool blue tones.`\n\n**Kodak Gold 200** — Jaune chaud, rendu vintage 90s, contraste doux.\n`Shot on Kodak Gold 200 film, warm yellow glow and soft vintage contrast.`\n\n**Fujifilm Velvia 50** — Super saturation, paysages riches, verts très présents.\n`Photographed on Fujifilm Velvia 50 film, vivid saturated greens and rich landscapes.`\n\n## Bons\n\n**Kodak Ektar 100** — Couleurs éclatantes, tons rouges et verts profonds, haute saturation.\n`Captured on Kodak Ektar 100 film, bold red and green tones with high saturation.`\n\n**Fujifilm Pro 400H** — Teintes froides/pastel, look doux, flatteur pour la peau.\n`Shot on Fujifilm Pro 400H film, soft pastel tones and flattering skin look.`\n\n**Kodak Vision3 500T** — Similaire à Cinestill, mais plus brut, cinéma de plateau.\n`Photographed on Kodak Vision3 500T film, cinematic tungsten look with raw atmosphere.`\n\n## Interprétés (résultats variables)\n\n**Polaroid Originals** — Bordures floues, format carré, couleurs atténuées.\n`Polaroid Originals film look, soft faded colors with blurry square frame.`\n\n**Lomography Redscale** — Teinte rouge/orange inversée, très graphique.\n`Lomography Redscale film style, inverted warm tones in deep red and orange.`\n\n**Lomography Diana F+** — Vignettage fort, flou créatif, look toy-camera.\n`Lomography Diana F+ toy camera look, heavy vignette and dreamy blur.`\n\n**Lomography X-Pro 200** — Cross-processing simulé, verts acides, couleurs faussées.\n`Lomography X-Pro 200 cross-processed film, acid green and surreal colors.`\n\n## Phrase type\n`A portrait of [subject], photographed on [Nom de la pellicule] film.`\n"},"OUTIL_themes-liste.md":{"file":"OUTIL_themes-liste.md","titleFr":"Liste de thèmes à piocher","titleEn":"Theme list to draw from","groupFr":"Exemples & outils","groupEn":"Examples & tools","descFr":"Des cas concrets et des listes d'inspiration pour démarrer plus vite.","descEn":"Concrete cases and inspiration lists to start faster.","markdown":"---\ntitle: \"Tableur – Liste de thèmes\"\ncategorie: OUTIL\nsous-theme: Thèmes\ntype-doc: Tableur\nversion-mj: Général\n---\n\n## Thèmes — Liste complète\n\n### Nature & Paysages\n| Thème | Phrase d'intro | Fin de prompt |\n|---|---|---|\n| Landscape | Create an image with a vast landscape, | --ar 16:9 --style raw |\n| Seascape | Generate a breathtaking seascape, | --zoom 2 --style expressive |\n| Forest | Depict a mystical forest, | --style imaginative --ar 3:2 |\n| Mountain | Create an image of majestic mountains, | --style photorealistic --ar 1:1 |\n| Desert | Generate a surreal desert landscape, | --style artistic --zoom 1.5 |\n| Jungle | Depict a vibrant jungle scene, | --style raw --ar 4:5 |\n| Underwater | Create an underwater world, | --style colorful --zoom 0.8 |\n| Space | Generate a cosmic space scene, | --style dreamy --ar 2:3 |\n\n### Fantastique & Science-fiction\n| Thème | Phrase d'intro | Fin de prompt |\n|---|---|---|\n| Fantasy | Create a fantasy world, | --style epic --ar 16:9 |\n| Sci-fi | Generate a sci-fi cityscape, | --style futuristic --zoom 2 |\n| Cyberpunk | Depict a cyberpunk dystopia, | --style gritty --ar 3:2 |\n| Steampunk | Create a steampunk invention, | --style intricate --ar 1:1 |\n| Dystopian | Generate a dystopian future, | --style bleak --zoom 1.5 |\n| Utopian | Depict a utopian society, | --style optimistic --ar 4:5 |\n\n### Histoire & Mythologie\n| Thème | Phrase d'intro | Fin de prompt |\n|---|---|---|\n| Historical | Create a historical scene, | --style realistic --ar 16:9 |\n| Mythology | Generate a mythological scene, | --style dramatic --zoom 2 |\n| Ancient | Depict an ancient city, | --style majestic --ar 3:2 |\n| Medieval | Create a medieval battle scene, | --style romantic --ar 1:1 |\n\n### Vie quotidienne & Portraits\n| Thème | Phrase d'intro | Fin de prompt |\n|---|---|---|\n| Portrait | Create a portrait of a woman, | --style expressive --zoom 1.5 |\n| Daily life | Generate a scene from daily life, | --style naturalistic --ar 4:5 |\n| Urban life | Depict urban life in Tokyo, | --style dynamic --zoom 0.8 |\n| Rural life | Create a rural landscape, | --style pastoral --ar 2:3 |\n\n### Abstrait & Conceptuel\n| Thème | Phrase d'intro | Fin de prompt |\n|---|---|---|\n| Abstract | Create an abstract artwork, | --style minimalist --ar 16:9 |\n| Conceptual | Generate a conceptual image about time, | --style philosophical --zoom 2 |\n| Surreal | Depict a surreal dreamscape, | --style dreamlike --ar 3:2 |\n\n### Autres thèmes\nHorror, Romance, Mystery, Thriller, Comedy, Music, Art, Fashion, Food\n"}}}</script><script>
const DATA=JSON.parse(document.getElementById('fiche-data').textContent);let lang=location.search.includes('lang=en')?'en':'fr';let query='';function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}function inline(s){return esc(s).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>');}function mdToHtml(md){md=md.replace(/^---\n[\s\S]*?\n---\n*/,'');const lines=md.replace(/\r/g,'').split('\n');let out='',list=null,table=[];const fl=()=>{if(list){out+=list==='ol'?'</ol>':'</ul>';list=null;}};const ft=()=>{if(table.length){out+='<table>'+table.map((r,i)=>'<tr>'+r.map(c=>(i===0?'<th>':'<td>')+inline(c.trim())+(i===0?'</th>':'</td>')).join('')+'</tr>').join('')+'</table>';table=[];}};for(const raw of lines){const line=raw.trim();if(!line){fl();ft();continue;}if(/^\|.*\|$/.test(line)&&!/^\|\s*-/.test(line)){fl();table.push(line.slice(1,-1).split('|'));continue;}if(/^\|\s*-/.test(line))continue;else ft();let m=line.match(/^(#{1,4})\s+(.+)/);if(m){fl();const level=Math.min(m[1].length+1,4);out+='<h'+level+'>'+inline(m[2])+'</h'+level+'>';continue;}if(/^---+$/.test(line)){fl();out+='<hr>';continue;}if(/^>\s?/.test(line)){fl();out+='<blockquote>'+inline(line.replace(/^>\s?/,''))+'</blockquote>';continue;}m=line.match(/^[-*]\s+(.+)/);if(m){if(list!=='ul'){fl();out+='<ul>';list='ul';}out+='<li>'+inline(m[1])+'</li>';continue;}m=line.match(/^\d+\.\s+(.+)/);if(m){if(list!=='ol'){fl();out+='<ol>';list='ol';}out+='<li>'+inline(m[1])+'</li>';continue;}m=line.match(/^\*\*(\d+[.)]?\s+[^*]+)\*\*$/);if(m){fl();out+='<h3>'+inline(m[1])+'</h3>';continue;}fl();out+='<p>'+inline(line)+'</p>';}fl();ft();return out;}function allFiles(){return DATA.groups.flatMap(g=>g[5]);}function currentId(){const id=decodeURIComponent((location.hash||'').replace(/^#/,''));return DATA.ficheData[id]?id:DATA.groups[0][5][0];}function highlightLabel(s,q){const safe=esc(s);if(!q)return safe;const re=new RegExp('('+q.replace(/[.*+?^${}()|[\\]\\]/g,'\\$&')+')','ig');return safe.replace(re,'<mark>$1</mark>');}function renderNav(){const nav=document.getElementById('nav');const status=document.getElementById('searchStatus');const clear=document.getElementById('searchClear');nav.innerHTML='';let total=0;const q=query.trim().toLowerCase();clear.classList.toggle('visible',!!q);for(const g of DATA.groups){const title=lang==='en'?g[2]:g[1];const matches=[];for(const f of g[5]){const item=DATA.ficheData[f];const label=lang==='en'?item.titleEn:item.titleFr;const labelHay=label.toLowerCase();const groupHay=(lang==='en'?item.groupEn:item.groupFr).toLowerCase();const fullHay=(label+' '+(lang==='en'?item.groupEn:item.groupFr)+' '+item.markdown).toLowerCase();if(!q||fullHay.includes(q))matches.push([f,item,label,(q&&!labelHay.includes(q)&&!groupHay.includes(q))]);}total+=matches.length;if(!matches.length)continue;const div=document.createElement('div');div.className='group-title';div.textContent=title;nav.appendChild(div);for(const row of matches){const f=row[0],item=row[1],label=row[2],contentHit=row[3];const a=document.createElement('a');a.className='nav-link';a.href='#'+encodeURIComponent(f);a.innerHTML=highlightLabel(label,q)+(contentHit?' <span class="nav-hit">'+(lang==='en'?'content':'contenu')+'</span>':'');if(f===currentId())a.classList.add('active');nav.appendChild(a);}}status.classList.toggle('active',!!q);status.textContent=q?(total?(lang==='en'?total+' note'+(total>1?'s':'')+' found':total+' fiche'+(total>1?'s':'')+' trouvée'+(total>1?'s':'')):(lang==='en'?'No note found':'Aucune fiche trouvée')):(lang==='en'?'Search titles and content':'Recherche titres et contenu');const active=nav.querySelector('.nav-link.active');if(active&&!q)active.scrollIntoView({block:'nearest'});}function render(){const id=currentId();const item=DATA.ficheData[id]||DATA.ficheData[DATA.groups[0][5][0]];document.documentElement.lang=lang;document.getElementById('langToggle').textContent=lang==='en'?'FR':'EN';document.getElementById('intro').textContent=lang==='en'?'Guided notes for turning visual ideas into stronger Midjourney prompts.':'Des fiches guidées pour transformer une idée visuelle en prompt Midjourney plus solide.';document.getElementById('quickStartKicker').textContent=lang==='en'?'Where to begin?':'Par où commencer ?';document.getElementById('quickStartTitle').textContent=lang==='en'?'Start here':'Point de départ';document.getElementById('quickStartText').textContent=lang==='en'?'Pick a need, then browse the full list.':'Choisissez un besoin, puis explorez la liste.';document.getElementById('quickStartBasics').innerHTML=lang==='en'?'<strong>Basics</strong>Build a clear, usable prompt.':'<strong>Bases</strong>Construire un prompt clair et utilisable.';document.getElementById('quickStartCharacter').innerHTML=lang==='en'?'<strong>Character</strong>Expressions, posture, body and action.':'<strong>Personnage</strong>Expressions, posture, corps et action.';document.getElementById('quickStartMood').innerHTML=lang==='en'?'<strong>Mood</strong>Style, light, color and atmosphere.':'<strong>Ambiance</strong>Style, lumière, couleur et atmosphère.';document.getElementById('searchHelp').textContent=lang==='en'?'Search by title, theme or words inside the notes.':'Recherchez par titre, thème ou mots présents dans les fiches.';document.getElementById('searchInput').placeholder=lang==='en'?'Search the notes':'Rechercher dans les fiches';document.getElementById('searchClear').setAttribute('aria-label',lang==='en'?'Clear search':'Effacer la recherche');document.getElementById('homeLink').innerHTML=lang==='en'?'&larr; Back to knowledge base':'&larr; Retour à la base de connaissances';document.getElementById('readCurrentLink').textContent=lang==='en'?'Read this note ↓':'Lire la fiche ↓';document.getElementById('navToggle').textContent=document.getElementById('nav').classList.contains('nav-collapsed')?(lang==='en'?'Show notes':'Afficher la liste'):(lang==='en'?'Hide notes':'Masquer la liste');document.getElementById('groupLabel').textContent=lang==='en'?item.groupEn:item.groupFr;document.getElementById('title').textContent=lang==='en'?item.titleEn:item.titleFr;document.getElementById('desc').textContent=lang==='en'?item.descEn:item.descFr;document.getElementById('article').innerHTML=mdToHtml(item.markdown);enhanceTables();buildArticleToc();const files=allFiles();const idx=files.indexOf(item.file);document.getElementById('noteCount').textContent=(lang==='en'?'Note ':'Fiche ')+(idx+1)+' / '+files.length;document.getElementById('topNoteLink').textContent=lang==='en'?'↑ Top of note':'↑ Haut de fiche';document.getElementById('studioBridgeText').innerHTML=lang==='en'?'<strong>Keep exploring ICHKA Studio</strong>Use these notes freely, then explore the portfolio, tools and studio updates.':'<strong>Continuer dans l’univers ICHKA Studio</strong>Servez-vous librement dans ces fiches, puis explorez le portfolio, les outils et les coulisses du studio.';document.getElementById('bridgePortfolio').textContent=lang==='en'?'Portfolio':'Portfolio';document.getElementById('bridgePortfolio').href=lang==='en'?'index-en.html#portfolio':'index.html#portfolio';document.getElementById('bridgeKnowledge').textContent=lang==='en'?'Knowledge base':'Base de connaissances';document.getElementById('bridgeKnowledge').href=lang==='en'?'index-en.html#knowledge':'index.html#knowledge';document.getElementById('bridgeThreads').textContent='Threads';document.getElementById('bottomHomeLink').textContent=lang==='en'?'← Back to knowledge base':'← Retour à la base de connaissances';document.getElementById('bottomHomeLink').href=lang==='en'?'index-en.html#knowledge':'index.html#knowledge';const prev=DATA.ficheData[files[(idx-1+files.length)%files.length]];const next=DATA.ficheData[files[(idx+1)%files.length]];document.getElementById('articleNav').innerHTML='<a class="prev" href="#'+encodeURIComponent(prev.file)+'"><span class="nav-kicker">'+(lang==='en'?'Previous note':'Fiche précédente')+'</span><span class="nav-title">← '+(lang==='en'?prev.titleEn:prev.titleFr)+'</span></a><a class="next" href="#'+encodeURIComponent(next.file)+'"><span class="nav-kicker">'+(lang==='en'?'Next note':'Fiche suivante')+'</span><span class="nav-title">'+(lang==='en'?next.titleEn:next.titleFr)+' →</span></a>';wireCopyCodes();renderNav();}function enhanceTables(){document.querySelectorAll('.article table').forEach(table=>{if(table.parentElement&&table.parentElement.classList.contains('table-wrap'))return;const wrap=document.createElement('div');wrap.className='table-wrap';table.parentNode.insertBefore(wrap,table);wrap.appendChild(table);});}function buildArticleToc(){const toc=document.getElementById('articleToc');const heads=[...document.querySelectorAll('.article h3')].filter(h=>h.textContent.trim().length);toc.innerHTML='';toc.classList.remove('visible');window.tocHeads=[];if(heads.length<3)return;const title=document.createElement('div');title.className='article-toc-title';title.textContent=lang==='en'?'In this note':'Dans cette fiche';const list=document.createElement('div');list.className='article-toc-list';window.tocHeads=heads.slice(0,8);window.tocHeads.forEach((h,i)=>{h.id='section-'+i;const b=document.createElement('button');b.type='button';b.textContent=h.textContent.trim();b.addEventListener('click',()=>h.scrollIntoView({behavior:'smooth',block:'start'}));list.appendChild(b);});toc.appendChild(title);toc.appendChild(list);toc.classList.add('visible');updateTocActive();}function showCopyToast(text){const toast=document.getElementById('copyToast');toast.textContent=text;toast.classList.add('show');clearTimeout(showCopyToast.t);showCopyToast.t=setTimeout(()=>toast.classList.remove('show'),1300);}async function copyText(text,source){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);showCopyToast(lang==='en'?'Copied':'Copié');return;}throw new Error('clipboard blocked');}catch(e){const selection=window.getSelection();const range=document.createRange();range.selectNodeContents(source);selection.removeAllRanges();selection.addRange(range);showCopyToast(lang==='en'?'Selected, Ctrl+C':'Sélectionné, Ctrl+C');}}function wireCopyCodes(){document.querySelectorAll('.article code').forEach(code=>{code.title=lang==='en'?'Click to copy':'Cliquer pour copier';code.setAttribute('role','button');code.tabIndex=0;code.addEventListener('click',()=>copyText(code.textContent.trim(),code));code.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();copyText(code.textContent.trim(),code);}});});}document.getElementById('searchInput').addEventListener('input',e=>{query=e.target.value;renderNav();});document.getElementById('searchClear').addEventListener('click',()=>{query='';const input=document.getElementById('searchInput');input.value='';renderNav();input.focus();});document.getElementById('readCurrentLink').addEventListener('click',e=>{e.preventDefault();document.getElementById('article').scrollIntoView({behavior:'smooth',block:'start'});});document.getElementById('navToggle').addEventListener('click',()=>{const nav=document.getElementById('nav');nav.classList.toggle('nav-collapsed');document.getElementById('navToggle').textContent=nav.classList.contains('nav-collapsed')?(lang==='en'?'Show notes':'Afficher la liste'):(lang==='en'?'Hide notes':'Masquer la liste');});document.getElementById('topNoteLink').addEventListener('click',e=>{e.preventDefault();document.querySelector('.article-head').scrollIntoView({behavior:'smooth',block:'start'});});document.getElementById('langToggle').addEventListener('click',e=>{e.preventDefault();lang=lang==='en'?'fr':'en';history.replaceState(null,'',location.pathname+(lang==='en'?'?lang=en':'')+location.hash);render();});function updateReadProgress(){const bar=document.getElementById('readProgressBar');const max=document.documentElement.scrollHeight-window.innerHeight;const pct=max>0?Math.min(100,Math.max(0,(window.scrollY/max)*100)):0;bar.style.width=pct+'%';}function updateTocActive(){const heads=window.tocHeads||[];const buttons=[...document.querySelectorAll('#articleToc button')];if(!heads.length||!buttons.length)return;let active=0;heads.forEach((h,i)=>{if(h.getBoundingClientRect().top<window.innerHeight*.35)active=i;});buttons.forEach((b,i)=>b.classList.toggle('active',i===active));}window.addEventListener('scroll',()=>{updateReadProgress();updateTocActive();},{passive:true});window.addEventListener('resize',updateReadProgress);window.addEventListener('hashchange',()=>{render();document.querySelector('.article-head').scrollIntoView({block:'start'});});render();updateReadProgress();
</script></body></html>
